<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Fábrica de Productos · Sesión 4 · Factores y producto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ====== Paleta del área de Matemáticas (rojo) ====== */
:root{
  --rojo:#DC2626; --rojo2:#F87171; --rojo-osc:#991B1B; --pastel:#FEF2F2; --pastel2:#FEE2E2; --borde:#FECACA;
  --fondo:#FFF7F5; --texto:#1F2937; --gris:#6B7280;
  --verde:#16A34A; --verde-p:#F0FDF4; --azul:#2563EB; --azul-p:#EFF6FF; --ambar:#F59E0B; --ambar-p:#FFFBEB;
}
*{box-sizing:border-box;margin:0;padding:0}
/* El tamaño base escala con la pantalla: válido de portátil a SMART MX 4K */
html{font-size:clamp(13px, min(1.02vw, 1.85vh), 48px)}
html,body{height:100%}
body{font-family:'Andika','Nunito','Quicksand',system-ui,sans-serif;background:var(--fondo);color:var(--texto);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;min-width:60px;min-height:60px;border-radius:18px;transition:transform .12s, box-shadow .12s, background .2s}
button:active{transform:scale(.96)}
button:focus-visible{outline:4px solid var(--azul);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ====== Barra superior ====== */
#barra{position:fixed;top:0;left:0;right:0;height:4.6rem;display:flex;align-items:center;gap:.7rem;padding:0 1rem;
  background:#fff;box-shadow:0 3px 0 var(--borde);z-index:50}
#barra::before{content:"";position:absolute;left:0;right:0;top:0;height:.35rem;background:linear-gradient(90deg,var(--rojo2),var(--rojo),var(--ambar))}
.btn-icono{width:3.6rem;height:3.6rem;font-size:1.8rem;background:var(--pastel);box-shadow:0 4px 0 var(--borde);display:flex;align-items:center;justify-content:center}
#titulo-barra{flex:1;font-size:1.5rem;font-weight:700;color:var(--rojo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#titulo-barra small{color:var(--gris);font-weight:400;font-size:1.05rem;margin-left:.6rem}
#btnFullscreen{position:static;background:var(--rojo);color:#fff;box-shadow:0 4px 0 var(--rojo-osc)}

/* ====== Escenario ====== */
#escenario{position:absolute;top:4.6rem;bottom:0;left:0;right:0;display:flex;flex-direction:column}
#contenido{flex:1;overflow:auto;padding:1.4rem 2.2rem 1rem 2.2rem}
#nav{height:6rem;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:#fff;box-shadow:0 -3px 0 var(--borde)}
.btn-nav{min-width:9rem;height:4.4rem;font-size:2rem;font-weight:700;background:var(--rojo);color:#fff;box-shadow:0 5px 0 var(--rojo-osc)}
.btn-nav[disabled]{opacity:.3;cursor:default}
#indicador{font-size:1.35rem;color:var(--gris);font-weight:700;text-align:center}
#puntos{display:flex;gap:.45rem;justify-content:center;margin-top:.4rem}
#puntos span{width:1rem;height:1rem;border-radius:50%;background:var(--borde)}
#puntos span.on{background:var(--rojo)}

/* ====== Tipografía y bloques ====== */
h1{font-size:2.7rem;color:var(--rojo);line-height:1.15;margin-bottom:.4rem}
.sub{font-size:1.4rem;color:var(--gris);margin-bottom:1.2rem}
.grande{font-size:1.75rem;line-height:1.45}
.enorme{font-size:3.6rem;font-weight:700;letter-spacing:.06em}
.tarjeta{background:#fff;border:3px solid var(--borde);border-radius:26px;box-shadow:0 7px 0 var(--borde);padding:1.3rem}
.tarjeta.roja{border-color:var(--rojo);box-shadow:0 7px 0 var(--rojo2);background:var(--pastel)}
.tarjeta.verde{border-color:var(--verde);box-shadow:0 7px 0 #BBF7D0;background:var(--verde-p)}
.tarjeta.azul{border-color:var(--azul);box-shadow:0 7px 0 #BFDBFE;background:var(--azul-p)}
.tarjeta.ambar{border-color:var(--ambar);box-shadow:0 7px 0 #FDE68A;background:var(--ambar-p)}
.fila{display:flex;gap:1.4rem;align-items:center}
.fila.arriba{align-items:stretch}
.col{display:flex;flex-direction:column;gap:1rem}
.c{text-align:center}
.flex1{flex:1}
.pastilla{display:inline-block;border-radius:30px;padding:.35rem 1.2rem;font-weight:700;font-size:1.3rem;background:var(--pastel2);color:var(--rojo-osc)}
.eq{font-size:2.9rem;font-weight:700;letter-spacing:.04em}
.eq.r{color:var(--rojo)}
.etiqueta{font-size:1.2rem;color:var(--gris)}
.svgbox svg{width:100%;height:auto;max-height:31vh;display:block;margin:0 auto}
.cajadib{display:flex;align-items:center;justify-content:center;margin:.3rem 0}
.cajadib svg{height:100%;width:auto;max-width:100%;display:block}
.svgh svg{height:5.2rem;width:auto;display:block}

/* ====== Botones de acción ====== */
.btn{padding:.7rem 1.5rem;font-size:1.5rem;font-weight:700;background:var(--rojo);color:#fff;box-shadow:0 5px 0 var(--rojo-osc)}
.btn.sec{background:#fff;color:var(--rojo);border:3px solid var(--rojo);box-shadow:0 5px 0 var(--borde)}
.btn.verde{background:var(--verde);box-shadow:0 5px 0 #166534}
.btn.azul{background:var(--azul);box-shadow:0 5px 0 #1E3A8A}
.btn.ambar{background:var(--ambar);box-shadow:0 5px 0 #B45309}
.btn.peq{font-size:1.25rem;padding:.5rem 1rem}
.opciones{display:flex;gap:1.1rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
.opcion{min-width:11rem;padding:1rem 1.6rem;font-size:2.1rem;font-weight:700;background:#fff;color:var(--texto);border:4px solid var(--borde);box-shadow:0 6px 0 var(--borde)}
.opcion.ok{background:#DCFCE7;border-color:var(--verde);box-shadow:0 6px 0 #86EFAC}
.opcion.ko{background:#FEE2E2;border-color:var(--rojo);box-shadow:0 6px 0 var(--rojo2);animation:temblor .35s}
@keyframes temblor{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:3.2rem;font-size:1.7rem;font-weight:700;text-align:center;margin-top:1rem}
.fb.ok{color:var(--verde)} .fb.ko{color:var(--rojo)}

/* Huecos que se descubren al tocar */
.hueco{display:inline-flex;align-items:center;justify-content:center;min-width:3.6rem;height:3.6rem;padding:0 .6rem;border-radius:14px;
  background:var(--pastel2);border:3px dashed var(--rojo2);color:transparent;font-weight:700;cursor:pointer;vertical-align:middle}
.hueco.visto{background:#fff;border-style:solid;border-color:var(--verde);color:var(--verde);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.15)}}
.oculto{visibility:hidden}

/* Reglas numeradas */
.regla{display:flex;align-items:center;gap:1.1rem;font-size:1.75rem;margin-bottom:1.1rem}
.regla .n{flex:none;width:3.4rem;height:3.4rem;border-radius:50%;background:var(--rojo);color:#fff;font-weight:700;font-size:1.8rem;display:flex;align-items:center;justify-content:center}

/* Deslizadores / contadores */
.contador{display:flex;align-items:center;gap:.8rem;font-size:1.5rem;font-weight:700}
.contador button{width:3.8rem;height:3.8rem;font-size:2rem;background:var(--pastel2);color:var(--rojo-osc);box-shadow:0 4px 0 var(--borde)}
.contador .v{min-width:3rem;text-align:center;font-size:2.4rem;color:var(--rojo)}

/* ====== Índice ====== */
.portada{background:linear-gradient(135deg,var(--rojo2),var(--rojo) 60%,#B91C1C);color:#fff;border-radius:30px;padding:1.6rem 2rem;margin-bottom:1.4rem;
  display:flex;align-items:center;gap:2rem;position:relative;overflow:hidden}
.portada h1{color:#fff;font-size:3.2rem;margin:0}
.portada .p1{font-size:1.4rem;opacity:.9;font-weight:700;letter-spacing:.08em}
.portada .p2{font-size:1.7rem;margin-top:.3rem}
.indice{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem}
.ap{position:relative;text-align:left;background:#fff;border:3px solid var(--borde);box-shadow:0 7px 0 var(--borde);border-radius:26px;padding:1.1rem 1.2rem;min-height:10.5rem;display:flex;flex-direction:column;justify-content:space-between}
.ap .ico{font-size:2.8rem}
.ap .t{font-size:1.45rem;font-weight:700;color:var(--texto);line-height:1.2}
.ap .m{font-size:1.1rem;color:var(--gris);display:flex;justify-content:space-between;align-items:center}
.ap .num{position:absolute;top:.8rem;right:1rem;font-weight:700;color:var(--rojo2);font-size:1.4rem}
.ap.completo{border-color:var(--verde);box-shadow:0 7px 0 #BBF7D0}
.ap.encurso{border-color:var(--ambar);box-shadow:0 7px 0 #FDE68A}
.ap.final{background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border-color:var(--ambar)}
.ap.final.listo{animation:latido 1.6s infinite}
@keyframes latido{50%{transform:scale(1.03)}}
.pie-indice{display:flex;justify-content:space-between;align-items:center;margin-top:1.2rem;color:var(--gris);font-size:1.2rem}

/* ====== Ventanas modales (ruleta, marcador) ====== */
.modal{position:fixed;inset:0;background:rgba(31,41,55,.55);display:flex;align-items:center;justify-content:center;z-index:200}
.modal[hidden]{display:none}
.caja{background:#fff;border-radius:30px;padding:1.6rem 2rem;min-width:44rem;max-width:90vw;max-height:88vh;overflow:auto;position:relative}
.caja h2{font-size:2.2rem;color:var(--rojo);margin-bottom:1rem}
.cerrar{position:absolute;top:1rem;right:1rem;width:3.6rem;height:3.6rem;font-size:1.8rem;background:var(--pastel2)}
#ruleta-nombre{font-size:4.2rem;font-weight:700;color:var(--rojo);text-align:center;min-height:6.2rem;margin:1rem 0;padding:.6rem;border-radius:20px;background:var(--pastel)}
#ruleta-nombre.girando{color:var(--gris)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}
.chips span{padding:.3rem .9rem;border-radius:20px;background:var(--pastel);font-size:1.1rem}
.chips span.usado{opacity:.35;text-decoration:line-through}
.equipo{display:flex;align-items:center;gap:1rem;padding:.6rem 0;border-bottom:2px solid var(--pastel2);font-size:1.6rem}
.equipo .nom{flex:1;font-weight:700}
.equipo .pts{min-width:4rem;text-align:center;font-size:2.4rem;font-weight:700;color:var(--rojo)}
.equipo button{width:3.6rem;height:3.6rem;font-size:1.8rem;background:var(--pastel2);color:var(--rojo-osc)}
textarea{width:100%;font:inherit;font-size:1.2rem;padding:.6rem;border-radius:14px;border:2px solid var(--borde);min-height:6rem}

/* Temporizador */
.reloj{position:relative;width:20rem;height:20rem}
.reloj svg{width:100%;height:100%}
.reloj .tiempo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4.2rem;font-weight:700;color:var(--rojo)}

/* Sello / estrella */
.sello{display:inline-block;border:6px solid var(--rojo);color:var(--rojo);border-radius:16px;padding:.4rem 1.4rem;font-weight:700;font-size:2rem;transform:rotate(-6deg);letter-spacing:.1em}
.estrella-gana{font-size:1.7rem;font-weight:700;color:var(--ambar);margin-top:.6rem;text-align:center}

/* Brillo de resaltado en SVG */
.brilla{filter:drop-shadow(0 0 6px #FBBF24) drop-shadow(0 0 12px #FBBF24)}

/* Confeti */
.confeti{position:fixed;top:-2rem;width:.9rem;height:1.3rem;border-radius:3px;z-index:300;pointer-events:none;animation:caer linear forwards}
@keyframes caer{to{transform:translateY(110vh) rotate(720deg)}}
#aviso{position:fixed;left:50%;bottom:7.2rem;transform:translateX(-50%);background:var(--texto);color:#fff;border-radius:20px;padding:.8rem 1.6rem;font-size:1.5rem;z-index:250;opacity:0;transition:opacity .3s;pointer-events:none}
#aviso.on{opacity:1}
</style>
</head>
<body>

<!-- ====== Barra superior: siempre visible ====== -->
<div id="barra">
  <button class="btn-icono" id="btnInicio" aria-label="Volver al índice" title="Índice">🏠</button>
  <div id="titulo-barra">La Fábrica de Productos <small>Sesión 4 · Factores y producto</small></div>
  <button class="btn-icono" id="btnRuleta" aria-label="Ruleta de voluntarios" title="Ruleta de voluntarios">🎯</button>
  <button class="btn-icono" id="btnMarcador" aria-label="Marcador de fábricas" title="Marcador de fábricas">🏭</button>
  <button class="btn-icono" id="btnSonido" aria-label="Silenciar" title="Sonido">🔊</button>
  <button class="btn-icono" id="btnFullscreen" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
</div>

<div id="escenario">
  <div id="contenido"></div>
  <div id="nav">
    <button class="btn-nav" id="btnAnt" aria-label="Pantalla anterior">◀</button>
    <div><div id="indicador"></div><div id="puntos"></div></div>
    <button class="btn-nav" id="btnSig" aria-label="Pantalla siguiente">▶</button>
  </div>
</div>

<!-- Ruleta de voluntarios -->
<div class="modal" id="modalRuleta" hidden>
  <div class="caja">
    <button class="cerrar" data-cerrar aria-label="Cerrar">✖</button>
    <h2>🎯 ¿Quién sale a la pantalla?</h2>
    <div id="ruleta-nombre">¿…?</div>
    <div class="fila" style="justify-content:center;gap:1rem">
      <button class="btn" id="btnGirar">🎲 ¡Girar!</button>
      <button class="btn sec" id="btnReiniciarRuleta">↺ Empezar lista</button>
    </div>
    <div class="chips" id="ruletaChips"></div>
    <details><summary style="font-size:1.1rem;color:var(--gris);cursor:pointer;margin-top:.6rem">✏️ Editar nombres (uno por línea)</summary>
      <textarea id="ruletaEditor"></textarea>
      <button class="btn peq" id="btnGuardarNombres" style="margin-top:.6rem">Guardar nombres</button>
    </details>
  </div>
</div>

<!-- Marcador de fábricas -->
<div class="modal" id="modalMarcador" hidden>
  <div class="caja">
    <button class="cerrar" data-cerrar aria-label="Cerrar">✖</button>
    <h2>🏭 Sellos de las fábricas</h2>
    <div id="listaEquipos"></div>
    <button class="btn sec peq" id="btnCeroMarcador" style="margin-top:1rem">↺ Poner a cero</button>
  </div>
</div>

<div id="aviso"></div>

<script>
// =====================================================================
// ============ CONFIGURACIÓN DEL DOCENTE ============
// ✏️ Modifica aquí nombres, equipos, tiempos y ejemplos.
// =====================================================================
const CONFIG = {
  titulo: 'La Fábrica de Productos · Sesión 4',
  personaje: 'Carmen',
  // ✏️ Nombres para la ruleta de voluntarios (también se editan desde la propia ruleta)
  alumnos: ['Alumno 1','Alumno 2','Alumno 3','Alumno 4','Alumno 5','Alumno 6','Alumno 7','Alumno 8',
            'Alumno 9','Alumno 10','Alumno 11','Alumno 12','Alumno 13','Alumno 14','Alumno 15','Alumno 16',
            'Alumno 17','Alumno 18','Alumno 19','Alumno 20','Alumno 21','Alumno 22','Alumno 23','Alumno 24'],
  // ✏️ Nombres de las fábricas (equipos) para el marcador de sellos
  equipos: ['Fábrica 1','Fábrica 2','Fábrica 3','Fábrica 4','Fábrica 5','Fábrica 6'],
  // ✏️ Minutos del temporizador del trabajo individual
  minutosFicha: 20,
  // Soluciones de la ficha que se descubren en la puesta en común
  actividad1: [[2,5,false],[4,3,false],[6,2,false],[3,7,false],[2,8,true]],   // [factor, factor, ¿producto delante?]
  actividad2: [[4,6],[2,9],[3,8],[2,7]],
  actividad3: [[3,5,2],[4,2,2],[6,2,1],[4,5,0]],   // [factor, factor, posición que falta: 0, 1 o 2 (producto)]
  actividad4: [2,4,5,7,10],
  actividad5: [['En 5 × 2 = 10, el producto es 10.',true,''],['En 3 × 6 = 18, los factores son 3 y 18.',false,'Los factores son 3 y 6.'],
               ['El doble de 6 es 12.',true,''],['El triple de 5 es 8.',false,'El triple de 5 es 15.'],['En 4 × 4 = 16, los dos factores son iguales.',true,'']],
  // Convención del aula: en 3 × 4 = 12, 3 y 4 son los factores y 12 es el producto («3 veces 4»)
};
// =====================================================================

const COLORES = ['#EF4444','#3B82F6','#F59E0B','#10B981','#8B5CF6','#EC4899','#14B8A6','#F97316','#6366F1','#84CC16'];
const $ = s => document.querySelector(s);
const azar = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const mezclar = arr => arr.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const sumaTxt = (n,k) => Array(n).fill(k).join(' + ');

// ---------------- Almacenamiento seguro ----------------
const CLAVE = 'fabrica-u2-s4';
let PROG = { estrellas:{}, visto:{}, equipos:null, alumnos:null };
try { const g = JSON.parse(localStorage.getItem(CLAVE)); if (g) PROG = Object.assign(PROG, g); } catch(e) {}
function guardar(){ try { localStorage.setItem(CLAVE, JSON.stringify(PROG)); } catch(e) {} }

// ---------------- Sonido (Web Audio API, se crea al primer toque) ----------------
let audioCtx = null, silencio = false;
function tono(f1,f2,inicio,dur,tipo='sine',vol=.25){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f1,inicio); o.frequency.exponentialRampToValueAtTime(f2,inicio+dur);
  g.gain.setValueAtTime(vol,inicio); g.gain.exponentialRampToValueAtTime(.001,inicio+dur);
  o.connect(g).connect(audioCtx.destination); o.start(inicio); o.stop(inicio+dur);
}
function sonido(tipo){
  if (silencio) return;
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    if (tipo==='ok')   tono(520,1040,t,.18);
    if (tipo==='ko')   { tono(220,180,t,.15,'triangle'); tono(220,180,t+.2,.15,'triangle'); }
    if (tipo==='win')  [523,659,784,1047].forEach((f,i)=>tono(f,f,t+i*.12,.25));
    if (tipo==='pop')  tono(700,900,t,.07,'sine',.15);
    if (tipo==='tic')  tono(1200,1200,t,.03,'square',.05);
    if (tipo==='alarma') [0,.35,.7].forEach(d=>{tono(880,880,t+d,.22,'square',.12);});
  } catch(e) {}
}
$('#btnSonido').addEventListener('click', ()=>{
  silencio = !silencio;
  $('#btnSonido').textContent = silencio ? '🔇' : '🔊';
  $('#btnSonido').setAttribute('aria-label', silencio ? 'Activar sonido' : 'Silenciar');
});

// ---------------- Pantalla completa ----------------
const btnFS = $('#btnFullscreen'), raiz = document.documentElement;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
if (!(raiz.requestFullscreen || raiz.webkitRequestFullscreen)) btnFS.hidden = true;
btnFS.addEventListener('click', ()=>{
  if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (raiz.requestFullscreen || raiz.webkitRequestFullscreen).call(raiz);
});
function iconoFS(){ const a = !!fsEl(); btnFS.textContent = a ? '✖' : '⛶'; btnFS.setAttribute('aria-label', a ? 'Salir de pantalla completa' : 'Pantalla completa'); }
document.addEventListener('fullscreenchange', iconoFS);
document.addEventListener('webkitfullscreenchange', iconoFS);

// ---------------- Avisos, confeti, bloqueo ----------------
let bloqueado = false;          // En la SMART MX pueden tocar varios a la vez: bloqueamos durante el feedback
function bloquear(ms=700){ bloqueado = true; setTimeout(()=>bloqueado=false, ms); }
function aviso(txt){ const a=$('#aviso'); a.textContent=txt; a.classList.add('on'); clearTimeout(aviso.t); aviso.t=setTimeout(()=>a.classList.remove('on'),2200); }
function confeti(n=70){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='confeti';
    c.style.left=Math.random()*100+'vw'; c.style.background=COLORES[i%COLORES.length];
    c.style.animationDuration=(1.8+Math.random()*1.8)+'s'; c.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),4200);
  }
}
function ganarEstrella(id){
  if (!PROG.estrellas[id]) { PROG.estrellas[id]=true; guardar(); }
  sonido('win'); confeti(); aviso('⭐ ¡Estrella conseguida!');
}

// ---------------- Dibujos SVG ----------------
// Vasos con fichas. opts.brillo: 'grupos' | 'uno' | null
function vasosSVG(n,k,opts={}){
  const cw=56, gap=14, filas=Math.max(1,Math.ceil(k/2)), h=40+filas*20+12, w=n*(cw+gap)+gap;
  let s='';
  for (let i=0;i<n;i++){
    const x0=gap+i*(cw+gap);
    const brilloVaso = opts.brillo==='grupos' ? ' class="brilla"' : '';
    s+=`<g${brilloVaso}><path d="M${x0},16 L${x0+cw},16 L${x0+cw-7},${h-4} L${x0+7},${h-4} Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>`;
    s+=`<ellipse cx="${x0+cw/2}" cy="16" rx="${cw/2}" ry="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/></g>`;
    const brilloFicha = (opts.brillo==='uno' && i===0) ? ' class="brilla"' : '';
    s+=`<g${brilloFicha}>`;
    for (let j=0;j<k;j++){
      const impar = (k%2===1 && j===k-1);
      const cx = impar ? x0+cw/2 : x0+cw/2+(j%2===0?-10:10);
      const cy = 32+Math.floor(j/2)*20;
      s+=`<circle cx="${cx}" cy="${cy}" r="8" fill="${COLORES[i%COLORES.length]}" stroke="#1F2937" stroke-width="1"/>`;
    }
    s+='</g>';
  }
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${n} vasos con ${k} fichas cada uno">${s}</svg>`;
}
// Bolsas de caramelos
function bolsasSVG(n,k){
  const bw=70, gap=18, filas=Math.max(1,Math.ceil(k/3)), h=50+filas*18+16, w=n*(bw+gap)+gap;
  let s='';
  for (let i=0;i<n;i++){
    const x0=gap+i*(bw+gap);
    s+=`<path d="M${x0+8},22 L${x0+bw-8},22 L${x0+bw},${h-8} Q${x0+bw/2},${h+2} ${x0},${h-8} Z" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>`;
    s+=`<path d="M${x0+12},22 Q${x0+bw/2},6 ${x0+bw-12},22" fill="none" stroke="#DC2626" stroke-width="2.5"/>`;
    for (let j=0;j<k;j++){
      const cx=x0+bw/2+((j%3)-1)*18, cy=40+Math.floor(j/3)*18;
      s+=`<circle cx="${cx}" cy="${cy}" r="7" fill="${COLORES[(j+i)%COLORES.length]}" stroke="#1F2937" stroke-width="1"/>`;
    }
  }
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${n} bolsas con ${k} caramelos cada una">${s}</svg>`;
}

// ---------------- Componentes reutilizables ----------------
// Pregunta de opción múltiple. opciones: [{t:'texto', ok:true}], alAcertar: callback
function pregunta(cont, opciones, alAcertar, msgOk='¡Lo has pillado! 🎉'){
  const zona=document.createElement('div');
  zona.innerHTML=`<div class="opciones"></div><div class="fb" aria-live="polite"></div>`;
  const ops=zona.querySelector('.opciones'), fb=zona.querySelector('.fb');
  let resuelto=false;
  mezclar(opciones).forEach(o=>{
    const b=document.createElement('button'); b.className='opcion'; b.innerHTML=o.t;
    b.addEventListener('click',()=>{
      if (bloqueado || resuelto) return;
      bloquear();
      if (o.ok){ resuelto=true; b.classList.add('ok'); b.innerHTML='✔️ '+o.t; fb.className='fb ok'; fb.textContent=msgOk; sonido('ok'); alAcertar && alAcertar(); }
      else { b.classList.add('ko'); fb.className='fb ko'; fb.textContent='❌ Casi… ¡Inténtalo otra vez!'; sonido('ko'); setTimeout(()=>b.classList.remove('ko'),700); }
    });
    ops.appendChild(b);
  });
  cont.appendChild(zona);
}
// Huecos que se descubren al tocar
function activarHuecos(cont){
  cont.querySelectorAll('.hueco').forEach(h=>h.addEventListener('click',()=>{
    if (h.classList.contains('visto')) return;
    h.classList.add('visto'); sonido('pop');
  }));
}
function hueco(v){ return `<span class="hueco" role="button" aria-label="Descubrir">${v}</span>`; }
// Contador con + y −
function contador(etq, valor, min, max, alCambiar){
  const d=document.createElement('div'); d.className='contador';
  d.innerHTML=`<span>${etq}</span><button aria-label="Menos">−</button><span class="v">${valor}</span><button aria-label="Más">+</button>`;
  const [bm,bp]=d.querySelectorAll('button'), v=d.querySelector('.v');
  const fijar=x=>{ valor=Math.max(min,Math.min(max,x)); v.textContent=valor; sonido('tic'); alCambiar(valor); };
  bm.addEventListener('click',()=>fijar(valor-1)); bp.addEventListener('click',()=>fijar(valor+1));
  return d;
}

// Máquina de multiplicar: entran a y b (factores, azul) y sale p (producto, rojo). null = hueco con '?'
function maquinaSVG(a,b,p,opts={}){
  const t=(x,y,v,col)=>{ const vacio=(v===null||v===undefined||v==='');
    return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Andika, sans-serif" font-size="78" font-weight="700" fill="${vacio?'#9CA3AF':col}">${vacio?'?':v}</text>`; };
  const brillo = opts.encendida ? `<circle cx="226" cy="358" r="70" fill="#FBBF24" opacity=".35"><animate attributeName="opacity" values=".1;.5;.1" dur="0.8s" repeatCount="indefinite"/></circle><circle cx="508" cy="358" r="70" fill="#FBBF24" opacity=".35"><animate attributeName="opacity" values=".5;.1;.5" dur="0.8s" repeatCount="indefinite"/></circle>` : '';
  return `<svg viewBox="0 0 800 593" role="img" aria-label="Máquina: entran ${a??'?'} y ${b??'?'}, sale ${p??'?'}"><image href="${ICONOS.maquina}" x="0" y="0" width="800" height="593"/>${brillo}${t(209,93,a,AZUL)}${t(484,93,b,AZUL)}${t(733,455,p,ROJO)}</svg>`;
}
// Ecuación coloreada: factores en azul, producto en rojo
function ecuacion(a,b,p,delante=false){
  const f=v=>`<span style="color:${AZUL}">${v}</span>`, g=v=>`<span style="color:${ROJO}">${v}</span>`;
  return delante ? `${g(p)} = ${f(a)} × ${f(b)}` : `${f(a)} × ${f(b)} = ${g(p)}`;
}

const TEMP = {
  total: CONFIG.minutosFicha*60, resto: CONFIG.minutosFicha*60, id:null, el:null,
  fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; },
  pintar(){ if(!this.el || !document.body.contains(this.el)) return;
    this.el.querySelector('#t').textContent=this.fmt(this.resto);
    this.el.querySelector('#arco').setAttribute('stroke-dashoffset', (276.46*(1-this.resto/this.total)).toFixed(2));
    this.el.querySelector('#play').textContent = this.id ? '⏸ Pausa' : (this.resto<this.total && this.resto>0 ? '▶ Seguir' : '▶ Empezar'); },
  montar(el){ this.el=el; el.querySelector('#play').onclick=()=>this.alternar(); el.querySelector('#reset').onclick=()=>this.reiniciar(); this.pintar(); },
  alternar(){ if(this.id){clearInterval(this.id);this.id=null;} else { if(this.resto<=0) this.resto=this.total;
      this.id=setInterval(()=>{ this.resto--; this.pintar(); if(this.resto<=0){clearInterval(this.id);this.id=null;this.pintar();sonido('alarma');aviso('⏰ ¡Tiempo! Terminamos la ficha.');} },1000);} this.pintar(); },
  reiniciar(){ clearInterval(this.id); this.id=null; this.resto=this.total; this.pintar(); }
};

  APARTADOS.forEach((ap,i)=>{
    const b=document.createElement('button'); const est=estado(ap);
    b.className=`ap ${est} ${ap.final?'final':''} ${ap.final&&hechos===normales.length?'listo':''}`;
    b.innerHTML=`<span class="num">${i+1}</span><span class="ico">${ap.icono}</span><span class="t">${ap.titulo}</span>
      <span class="m"><span>${ap.pantallas.length} ${ap.pantallas.length===1?'pantalla':'pantallas'} · ${ap.tiempo}</span><span style="font-size:1.6rem">${est==='completo'?'⭐':est==='encurso'?'🔵':'⚪'}</span></span>`;
    b.onclick=()=>irA(i,0);
    $('#ind').appendChild(b);
  });
  $('#reiniciar').onclick=()=>{ if(confirm('¿Borrar las estrellas y empezar de cero?')){PROG.estrellas={};PROG.visto={};guardar();pintarIndice();} };
  $('#nav').style.display='none';
  if (location.hash) history.replaceState(null,'',location.pathname+location.search);
}
function irA(a,p){
  const ap=APARTADOS[a]; if(!ap) return pintarIndice();
  p=Math.max(0,Math.min(ap.pantallas.length-1,p));
  ACTUAL={a,p}; PROG.visto[ap.id]=true; guardar();
  const c=$('#contenido'); c.innerHTML=''; c.scrollTop=0;
  const pant=document.createElement('div'); c.appendChild(pant);
  ap.pantallas[p](pant);
  $('#nav').style.display='flex';
  $('#btnAnt').disabled = (p===0);
  $('#btnSig').textContent = (p===ap.pantallas.length-1) ? '🏠' : '▶';
  $('#btnSig').setAttribute('aria-label', p===ap.pantallas.length-1 ? 'Volver al índice' : 'Pantalla siguiente');
  $('#indicador').innerHTML=`${ap.icono} ${ap.titulo} · Pantalla ${p+1} de ${ap.pantallas.length}`;
  $('#puntos').innerHTML=ap.pantallas.map((_,i)=>`<span class="${i===p?'on':''}"></span>`).join('');
  history.replaceState(null,'',`#apartado-${a+1}${p>0?'-'+(p+1):''}`);
}
$('#btnInicio').onclick=()=>pintarIndice();
$('#btnAnt').onclick=()=>{ if(ACTUAL.a!==null) irA(ACTUAL.a,ACTUAL.p-1); };
$('#btnSig').onclick=()=>{ if(ACTUAL.a===null) return; const ap=APARTADOS[ACTUAL.a];
  if(ACTUAL.p<ap.pantallas.length-1) irA(ACTUAL.a,ACTUAL.p+1); else pintarIndice(); };
// Teclado / mando de presentación: flechas para avanzar y retroceder
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA') return;
  if(['ArrowRight','PageDown'].includes(e.key) && ACTUAL.a!==null) $('#btnSig').click();
  if(['ArrowLeft','PageUp'].includes(e.key) && ACTUAL.a!==null && ACTUAL.p>0) $('#btnAnt').click();
  if(e.key==='Home') pintarIndice();
});

// ---------------- Modales ----------------
function abrir(id){ $(id).hidden=false; }
document.querySelectorAll('.modal').forEach(m=>{
  m.addEventListener('click',e=>{ if(e.target===m || e.target.hasAttribute('data-cerrar')) m.hidden=true; });
});

// Ruleta de voluntarios (no repite hasta que salen todos)
let alumnos = PROG.alumnos || CONFIG.alumnos.slice(), usados = [];
function pintarChips(){ $('#ruletaChips').innerHTML=alumnos.map(a=>`<span class="${usados.includes(a)?'usado':''}">${a}</span>`).join(''); }
$('#btnRuleta').onclick=()=>{ $('#ruletaEditor').value=alumnos.join('\n'); pintarChips(); abrir('#modalRuleta'); };
$('#btnGirar').onclick=()=>{
  if(bloqueado) return; let quedan=alumnos.filter(a=>!usados.includes(a));
  if(!quedan.length){ usados=[]; quedan=alumnos.slice(); aviso('🔄 Ya han salido todos. ¡Empezamos otra vuelta!'); }
  if(!quedan.length) return;
  bloquear(1700); const nom=$('#ruleta-nombre'); nom.classList.add('girando'); let t=0;
  const giro=setInterval(()=>{ nom.textContent=alumnos[azar(0,alumnos.length-1)]; sonido('tic'); if((t+=90)>=1500){ clearInterval(giro);
    const elegido=quedan[azar(0,quedan.length-1)]; usados.push(elegido); nom.textContent='🌟 '+elegido; nom.classList.remove('girando'); sonido('win'); pintarChips(); } },90);
};
$('#btnReiniciarRuleta').onclick=()=>{ usados=[]; $('#ruleta-nombre').textContent='¿…?'; pintarChips(); };
$('#btnGuardarNombres').onclick=()=>{ const l=$('#ruletaEditor').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(l.length){ alumnos=l; usados=[]; PROG.alumnos=l; guardar(); pintarChips(); aviso('✅ Nombres guardados'); } };

// Marcador de sellos por fábricas
let equipos = PROG.equipos || CONFIG.equipos.map(n=>({n,p:0}));
function pintarEquipos(){
  $('#listaEquipos').innerHTML='';
  equipos.forEach((e,i)=>{ const f=document.createElement('div'); f.className='equipo';
    f.innerHTML=`<span class="nom">🏭 ${e.n}</span><button aria-label="Quitar sello">−</button><span class="pts">${e.p}</span><button aria-label="Añadir sello">+</button>`;
    const [m,p]=f.querySelectorAll('button');
    m.onclick=()=>{ e.p=Math.max(0,e.p-1); PROG.equipos=equipos; guardar(); pintarEquipos(); };
    p.onclick=()=>{ e.p++; PROG.equipos=equipos; guardar(); sonido('ok'); pintarEquipos(); };
    $('#listaEquipos').appendChild(f); });
}
$('#btnMarcador').onclick=()=>{ pintarEquipos(); abrir('#modalMarcador'); };
$('#btnCeroMarcador').onclick=()=>{ equipos.forEach(e=>e.p=0); PROG.equipos=equipos; guardar(); pintarEquipos(); };

// ---------------- Arranque (admite enlaces directos: #apartado-3 o #apartado-3-2) ----------------
(function(){
  const m=location.hash.match(/^#apartado-(\d+)(?:-(\d+))?$/);
  if(m) irA(+m[1]-1, m[2]?+m[2]-1:0); else pintarIndice();
})();
</script>
</body>
