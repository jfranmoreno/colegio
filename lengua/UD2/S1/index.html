<style>

    --pastel: #EFF6FF; --borde: #BFDBFE; --acierto: #8BD3A8; --aciertoOsc: #166534;
    --error: #F4A6A6; --texto: #1e293b; --amarillo: #FDE68A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Andika', 'Quicksand', 'Nunito', system-ui, sans-serif;
    background: var(--fondo); color: var(--texto);
    touch-action: manipulation; user-select: none; overflow: hidden;
  }
  button { min-width: 60px; min-height: 60px; border-radius: 18px; font: inherit; cursor: pointer; border: none; }
  button:active { transform: scale(0.96); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* Barra superior */
  #top { position: fixed; top: 0; left: 0; right: 0; height: 84px; display: flex; align-items: center; gap: 14px;
         padding: 0 96px 0 20px; background: #fff; border-bottom: 4px solid var(--primario); z-index: 50; }
  #top .t { font-weight: 700; color: var(--oscuro); font-size: 1.35rem; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icono { width: 64px; height: 64px; font-size: 1.8rem; background: var(--pastel); box-shadow: 0 3px 8px rgba(29,78,216,.15); }
  #btnFullscreen { position: fixed; top: 10px; right: 12px; z-index: 1000; width: 64px; height: 64px; font-size: 1.8rem;
                   background: white; box-shadow: 0 4px 12px rgba(0,0,0,.15); }

  /* Pantallas */
  main { position: absolute; top: 84px; bottom: 104px; left: 0; right: 0; overflow: auto; }
  .pantalla { display: none; min-height: 100%; padding: 26px 40px; flex-direction: column; align-items: center; gap: 22px; animation: entra .35s ease; }
  .pantalla.activa { display: flex; }
  @keyframes entra { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  h1 { font-size: clamp(2.6rem, 5vw, 4.2rem); color: var(--tinta); text-align: center; line-height: 1.1; }
  h2 { font-size: clamp(2rem, 3.4vw, 2.9rem); color: var(--tinta); text-align: center; }
  .txt { font-size: clamp(1.5rem, 2.2vw, 2rem); line-height: 1.45; text-align: center; max-width: 1100px; }
  .fase { background: linear-gradient(90deg, var(--primario), var(--oscuro)); color: #fff; padding: 6px 20px; border-radius: 999px; font-weight: 700; font-size: 1.2rem; }
  .grande { background: linear-gradient(90deg, var(--primario), var(--oscuro)); color: #fff; font-size: 2rem; font-weight: 700; padding: 18px 46px; box-shadow: 0 6px 16px rgba(29,78,216,.3); }
  .suave { background: #fff; color: var(--oscuro); border: 3px solid var(--borde); font-size: 1.5rem; font-weight: 700; padding: 12px 26px; }

  /* Inicio */
  #inicio { justify-content: center; gap: 16px !important; background: linear-gradient(135deg, var(--primario), var(--oscuro)); color: #fff; }
  #inicio h1 { color: #fff; font-size: clamp(3rem, 7vw, 5.5rem); }
  #inicio .txt { color: #DBEAFE; }
  #inicio .grande { background: #fff; color: var(--oscuro); font-size: 2.4rem; }

  /* Carta */
  .sobre { width: min(520px, 80vw); aspect-ratio: 3/2; background: linear-gradient(160deg, #FFF7E6, #FDE7B9); border-radius: 22px; position: relative;
           box-shadow: 0 10px 24px rgba(0,0,0,.15); display: flex; align-items: center; justify-content: center; font-size: 5rem; }
  .sobre::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 55%; background: #F9D98C;
                   clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 22px 22px 0 0; }
  .sobre span { position: relative; }
  .carta { max-width: 1050px; background: #FFFDF7; border: 4px solid var(--borde); border-radius: 26px; padding: 26px 36px; font-size: clamp(1.4rem, 2vw, 1.8rem); line-height: 1.55; display: none; }
  .carta p { margin-bottom: 10px; } .carta .firma { text-align: right; font-weight: 700; color: var(--tinta); }

  /* Veo pienso */
  .vp { display: flex; gap: 26px; width: 100%; max-width: 1400px; align-items: stretch; }
  .foto { flex: 1; min-height: 360px; border: 5px dashed var(--borde); border-radius: 26px; background: #fff; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 14px; color: #64748B; font-size: 1.5rem; text-align: center; padding: 20px; overflow: hidden; }
  .foto img { max-width: 100%; max-height: 36vh; border-radius: 16px; } .foto { gap: 8px !important; padding: 12px !important; border-style: solid !important; }
  .vpcol { flex: 0 0 340px; display: flex; flex-direction: column; gap: 16px; }
  .vpcard { background: #fff; border: 4px solid var(--borde); border-radius: 22px; padding: 14px 18px; font-size: 1.5rem; text-align: left; }
  .vpcard b { display: block; font-size: 1.9rem; color: var(--oscuro); }
  .vpcard.on { border-color: var(--primario); background: var(--pastel); }

  /* Temporizador */
  .timer { display: flex; align-items: center; gap: 14px; }
  .reloj { width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.7rem; color: var(--tinta);
           background: conic-gradient(var(--primario) var(--p, 100%), var(--pastel) 0); position: relative; }
  .reloj::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #fff; }
  .reloj span { position: relative; z-index: 1; }

  /* Opciones */
  .opciones { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; max-width: 1300px; }
  .opcion { flex: 1 1 300px; min-height: 150px; background: #fff; border: 4px solid var(--borde); color: var(--texto); font-size: 1.7rem; padding: 18px; text-align: left; box-shadow: 0 6px 14px rgba(29,78,216,.1); }
  .opcion b { display: block; font-size: 2.4rem; color: var(--oscuro); }
  .opcion.bien { background: #DCFCE7; border-color: var(--aciertoOsc); }
  .opcion.mal { background: #FEE2E2; border-color: #DC2626; }
  .feedback { font-size: 1.8rem; font-weight: 700; min-height: 2.4rem; text-align: center; }
  .solucion { display: none; background: #F0FDF4; border: 4px solid #86EFAC; border-radius: 24px; padding: 20px 30px; font-size: clamp(1.4rem, 2vw, 1.8rem); line-height: 1.5; max-width: 1150px; }
  .solucion b { color: var(--aciertoOsc); }

  /* Galería */
  .galeria { display: grid; grid-template-columns: repeat(4, minmax(140px, 180px)); gap: 14px; justify-content: center; }
  .flip { perspective: 900px; background: none; padding: 0; min-height: 0; }
  .flip .in { position: relative; width: 100%; aspect-ratio: 3/3.6; transition: transform .6s; transform-style: preserve-3d; }
  .flip.girada .in { transform: rotateY(180deg); }
  .cara { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 22px; border: 4px solid var(--borde); background: #fff; overflow: hidden;
          display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 8px; }
  .cara img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; }
  .cara .nom { font-weight: 700; color: var(--tinta); font-size: 1.1rem; line-height: 1.15; margin-top: 6px; text-align: center; }
  .cara.atras { transform: rotateY(180deg); background: linear-gradient(160deg, var(--primario), var(--oscuro)); color: #fff; justify-content: center; text-align: center; gap: 6px; padding: 8px; }
  .cara.atras .eq { font-size: 1.2rem; font-weight: 700; line-height: 1.1; } .cara.atras .clave { background: #fff; color: var(--oscuro); border-radius: 999px; padding: 4px 10px; font-weight: 700; font-size: .95rem; line-height: 1.15; }
  .cara.atras .dato { font-size: .92rem; line-height: 1.22; }
  .mh { width: 100%; aspect-ratio: 1; border-radius: 14px; background: linear-gradient(135deg, var(--primario), var(--oscuro)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 3.4rem; font-weight: 700; }

  /* Misión */
  .pasos { display: flex; flex-direction: column; gap: 16px; max-width: 1100px; width: 100%; }
  .paso { display: flex; align-items: center; gap: 20px; background: #fff; border: 4px solid var(--borde); border-radius: 22px; padding: 12px 20px; font-size: 1.6rem; text-align: left; color: var(--texto); }
  .paso .n { flex: 0 0 64px; height: 64px; border-radius: 50%; background: var(--oscuro); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.8rem; }
  .paso.hecho { background: #DCFCE7; border-color: #86EFAC; } .paso.hecho .n { background: var(--aciertoOsc); }

  /* Sigla */
  .letras { display: flex; gap: 26px; justify-content: center; flex-wrap: wrap; }
  .letra { width: 210px; height: 210px; background: linear-gradient(135deg, var(--primario), var(--oscuro)); color: #fff; font-size: 7rem; font-weight: 700;

  .letra small { font-size: 1.6rem; margin-top: 10px; opacity: 0; transition: opacity .3s; }
  .letra.vista small { opacity: 1; }
  .chips { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .chipb { background: #fff; border: 4px solid var(--borde); color: var(--texto); font-size: 1.9rem; font-weight: 700; padding: 10px 30px; border-radius: 999px; }

  .chipb.bien { background: #DCFCE7; border-color: var(--aciertoOsc); } .chipb.mal { background: #FEE2E2; border-color: #DC2626; }

  .retos { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1400px; }
  .caja { flex: 1 1 520px; background: #fff; border: 4px solid var(--borde); border-radius: 26px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .caja h3 { font-size: 1.9rem; color: var(--oscuro); }
  input[type=text], select { font: inherit; font-size: 1.6rem; padding: 10px 14px; border-radius: 14px; border: 3px solid var(--borde); width: 100%; min-height: 60px; user-select: text; }
  .siglaRes { font-size: 4.5rem; font-weight: 700; color: var(--oscuro); letter-spacing: 8px; min-height: 5rem; }
  .edad { font-size: 2.2rem; font-weight: 700; color: var(--aciertoOsc); min-height: 3rem; text-align: center; }

  #nav { position: fixed; bottom: 0; left: 0; right: 0; height: 104px; background: #fff; border-top: 4px solid var(--borde); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 50; }
  #nav button.flecha { width: 92px; height: 76px; font-size: 2.2rem; background: linear-gradient(90deg, var(--primario), var(--oscuro)); color: #fff; }
  #nav button.flecha:disabled { opacity: .3; }
  #prog { font-size: 1.5rem; font-weight: 700; color: var(--tinta); text-align: center; }
  #puntos { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
  #puntos i { width: 14px; height: 14px; border-radius: 50%; background: var(--borde); display: block; }
  #puntos i.on { background: var(--oscuro); }

  /* Marcador */
  #marcador { position: fixed; right: 16px; top: 100px; background: #fff; border: 4px solid var(--borde); border-radius: 22px; padding: 12px; z-index: 60; display: none; width: 290px; box-shadow: 0 8px 20px rgba(0,0,0,.15); }
  #marcador.ver { display: block; }
  #marcador h4 { font-size: 1.3rem; color: var(--oscuro); margin-bottom: 6px; text-align: center; }
  .fila { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 1.15rem; }
  .fila button { min-width: 60px; min-height: 60px; background: var(--pastel); font-size: 1.5rem; font-weight: 700; color: var(--oscuro); }
  .fila .pt { font-weight: 700; font-size: 1.5rem; width: 40px; text-align: center; }

  /* Confeti */
  .confeti { position: fixed; top: -20px; width: 14px; height: 18px; z-index: 2000; animation: cae linear forwards; pointer-events: none; }
  @keyframes cae { to { transform: translateY(110vh) rotate(720deg); } }

  @media (max-width: 900px) { .vp { flex-direction: column; } .vpcol { flex: none; } .galeria { grid-template-columns: repeat(2, minmax(150px, 1fr)); } #top .t { font-size: 1rem; } }
</style>

// ---------- Audio con Web Audio API (se crea en el primer toque) ----------
let audioCtx = null, silencio = false;
function tono(f1, f2, ini, dur, tipo = 'sine') {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f1, ini); o.frequency.exponentialRampToValueAtTime(f2, ini + dur);
  g.gain.setValueAtTime(0.22, ini); g.gain.exponentialRampToValueAtTime(0.001, ini + dur);
  o.connect(g).connect(audioCtx.destination); o.start(ini); o.stop(ini + dur);
}
function playSound(tipo) {
  if (silencio) return;
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    if (tipo === 'success') tono(520, 1040, t, 0.18);
    if (tipo === 'error') { tono(220, 180, t, 0.15, 'triangle'); tono(220, 180, t + 0.2, 0.15, 'triangle'); }
    if (tipo === 'win') [523, 659, 784, 1047].forEach((f, i) => tono(f, f, t + i * 0.12, 0.25));
    if (tipo === 'flip') tono(700, 900, t, 0.08);
    if (tipo === 'fin') [784, 659, 784, 1047].forEach((f, i) => tono(f, f, t + i * 0.15, 0.3));
  } catch (e) { /* sin audio: la actividad sigue funcionando */ }
}

// ---------- Confeti ----------
function confeti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colores = ['#3B82F6', '#1D4ED8', '#FDE68A', '#8BD3A8', '#F4A6A6', '#93C5FD'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div'); c.className = 'confeti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colores[i % colores.length];
    c.style.animationDuration = 2 + Math.random() * 2 + 's'; c.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}

// ---------- Temporizador reutilizable ----------
function crearTemporizador(minutos) {
  const w = document.createElement('div'); w.className = 'timer';
  w.innerHTML = `<div class="reloj"><span>${minutos}:00</span></div><button class="suave">▶️ Empezar</button>`;
  const reloj = w.querySelector('.reloj'), span = reloj.querySelector('span'), btn = w.querySelector('button');
  let total = minutos * 60, resta = total, id = null;
  const pintar = () => { span.textContent = `${Math.floor(resta / 60)}:${String(resta % 60).padStart(2, '0')}`; reloj.style.setProperty('--p', (resta / total * 100) + '%'); };
  btn.addEventListener('click', () => {
    if (id) { clearInterval(id); id = null; btn.textContent = '▶️ Seguir'; return; }
    if (resta === 0) { resta = total; pintar(); }
    btn.textContent = '⏸️ Pausa';
    id = setInterval(() => { resta--; pintar(); if (resta <= 0) { clearInterval(id); id = null; btn.textContent = '🔁 Otra vez'; playSound('fin'); } }, 1000);
  });
  pintar(); return w;
}

let actual = 0;
const btnAnt = document.getElementById('btnAnt'), btnSig = document.getElementById('btnSig'), prog = document.getElementById('prog'), puntos = document.getElementById('puntos');
pantallas.forEach(() => puntos.append(el('i')));
function ir(n) {
  actual = Math.max(0, Math.min(pantallas.length - 1, n));
  pantallas.forEach((p, i) => p.classList.toggle('activa', i === actual));
  btnAnt.disabled = actual === 0; btnSig.disabled = actual === pantallas.length - 1;
  prog.textContent = `Pantalla ${actual + 1} de ${pantallas.length}`;
  [...puntos.children].forEach((d, i) => d.classList.toggle('on', i <= actual));
  main.scrollTop = 0;
  try { history.replaceState(null, '', '#' + pantallas[actual].id); } catch (e) {}
}
btnAnt.addEventListener('click', () => ir(actual - 1));
btnSig.addEventListener('click', () => ir(actual + 1));
document.getElementById('btnCasa').addEventListener('click', () => ir(0));
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') ir(actual + 1); if (e.key === 'ArrowLeft') ir(actual - 1); });

function guardar() { try { localStorage.setItem('galeria27_s1_puntos', JSON.stringify(pts)); } catch (e) {} }
function pintarMarcador() {
  filas.innerHTML = '';
  CONFIG.equipos.forEach((n, i) => {
    const f = el('div', 'fila', `<span>${n}</span>`); const menos = el('button', '', '−'), pt = el('span', 'pt', pts[i]), mas = el('button', '', '+');

    f.append(menos, pt, mas); filas.append(f);
  });
}
