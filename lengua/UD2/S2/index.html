// ---------- Audio con Web Audio API (se crea en el primer toque) ----------
let audioCtx = null, silencio = false;
function tono(f1, f2, ini, dur, tipo = 'sine') {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f1, ini); o.frequency.exponentialRampToValueAtTime(f2, ini + dur);
  g.gain.setValueAtTime(0.22, ini); g.gain.exponentialRampToValueAtTime(0.001, ini + dur);
  o.connect(g).connect(audioCtx.destination); o.start(ini); o.stop(ini + dur);
}
function playSound(tipo) {
  if (silencio) return;
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    if (tipo === 'success') tono(520, 1040, t, 0.18);
    if (tipo === 'error') { tono(220, 180, t, 0.15, 'triangle'); tono(220, 180, t + 0.2, 0.15, 'triangle'); }
    if (tipo === 'win') [523, 659, 784, 1047].forEach((f, i) => tono(f, f, t + i * 0.12, 0.25));
    if (tipo === 'flip') tono(700, 900, t, 0.08);
    if (tipo === 'fin') [784, 659, 784, 1047].forEach((f, i) => tono(f, f, t + i * 0.15, 0.3));
  } catch (e) { /* sin audio: la actividad sigue funcionando */ }
}
const btnSonido = document.getElementById('btnSonido');
btnSonido.addEventListener('click', () => { silencio = !silencio; btnSonido.textContent = silencio ? '🔇' : '🔊'; btnSonido.setAttribute('aria-label', silencio ? 'Activar sonido' : 'Silenciar'); });

// ---------- Pantalla completa ----------
const btnFS = document.getElementById('btnFullscreen'), root = document.documentElement;
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
if (!(root.requestFullscreen || root.webkitRequestFullscreen)) btnFS.hidden = true;
btnFS.addEventListener('click', () => {
  if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
});
function actualizarIconoFS() { const a = !!fsElement(); btnFS.textContent = a ? '✖' : '⛶'; btnFS.setAttribute('aria-label', a ? 'Salir de pantalla completa' : 'Pantalla completa'); }
document.addEventListener('fullscreenchange', actualizarIconoFS);
document.addEventListener('webkitfullscreenchange', actualizarIconoFS);

// ---------- Confeti ----------
function confeti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colores = ['#3B82F6', '#1D4ED8', '#FDE68A', '#8BD3A8', '#F4A6A6', '#93C5FD'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div'); c.className = 'confeti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colores[i % colores.length];
    c.style.animationDuration = 2 + Math.random() * 2 + 's'; c.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}

// ---------- Temporizador reutilizable ----------
function crearTemporizador(minutos) {
  const w = document.createElement('div'); w.className = 'timer';
  w.innerHTML = `<div class="reloj"><span>${minutos}:00</span></div><button class="suave">▶️ Empezar</button>`;
  const reloj = w.querySelector('.reloj'), span = reloj.querySelector('span'), btn = w.querySelector('button');
  let total = minutos * 60, resta = total, id = null;
  const pintar = () => { span.textContent = `${Math.floor(resta / 60)}:${String(resta % 60).padStart(2, '0')}`; reloj.style.setProperty('--p', (resta / total * 100) + '%'); };
  btn.addEventListener('click', () => {
    if (id) { clearInterval(id); id = null; btn.textContent = '▶️ Seguir'; return; }
    if (resta === 0) { resta = total; pintar(); }
    btn.textContent = '⏸️ Pausa';
    id = setInterval(() => { resta--; pintar(); if (resta <= 0) { clearInterval(id); id = null; btn.textContent = '🔁 Otra vez'; playSound('fin'); } }, 1000);
  });
  pintar(); return w;
}

// ---------- Utilidades ----------
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };

const mezclar = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);

// 3 · DURANTE: caza de palabras por colores
(() => {
  const p = nueva('colores');
  p.append(el('span', 'fase durante', 'Durante la lectura'), el('h2', '', '🖍️ Subraya con colores'),
    el('div', 'txt', 'Elige un color, toca las palabras y pulsa «Comprobar».'));
  const cats = CONFIG.categorias; let actual = 'fechas';
  const selector = el('div', 'botonera');
  const botonesCat = Object.entries(cats).map(([k, c]) => {
    const b = el('button', 'colorbtn', `${c.icono} ${c.nombre}`); b.style.setProperty('--c', c.color); b.style.setProperty('--b', c.borde);
    b.addEventListener('click', () => { actual = k; botonesCat.forEach(x => x.classList.remove('on')); b.classList.add('on'); playSound('flip'); });
    selector.append(b); return b;
  });
  botonesCat[0].classList.add('on');
  // Construye fichas: primero las expresiones de varias palabras, después palabra a palabra
  const objetivo = []; Object.entries(cats).forEach(([k, c]) => c.palabras.forEach(w => objetivo.push([w, k])));
  objetivo.sort((a, b) => b[0].length - a[0].length);
  const caja = el('div', 'lectura caza'); const fichas = [];
  CONFIG.parrafos.forEach((t, i) => {
    const par = el('p', '', `<span class="np">${i + 1}</span>`);
    let resto = t;
    while (resto.length) {
      let hecho = false;
      for (const [w, k] of objetivo) {
        if (resto.startsWith(w) && !/[\wáéíóúñ]/i.test(resto[w.length] || '')) { fichas.push(ficha(par, w, k)); resto = resto.slice(w.length); hecho = true; break; }
      }
      if (hecho) continue;
      const m = resto.match(/^[\wáéíóúüñÁÉÍÓÚÑ]+/);
      if (m) { fichas.push(ficha(par, m[0], null)); resto = resto.slice(m[0].length); }
      else { par.append(document.createTextNode(resto[0])); resto = resto.slice(1); }
    }
    caja.append(par);
  });
  function ficha(par, txt, cat) {
    const s = el('button', 'pal', txt); s.dataset.cat = cat || ''; s.dataset.sel = '';
    s.addEventListener('click', () => {
      if (s.dataset.sel === actual) { s.dataset.sel = ''; s.style.background = ''; s.style.borderColor = 'transparent'; }
      else { s.dataset.sel = actual; s.style.background = cats[actual].color; s.style.borderColor = cats[actual].borde; }
      s.classList.remove('ok', 'ko'); playSound('flip');
    });
    par.append(s); return s;
  }
  const fb = el('div', 'feedback'), fila = el('div', 'botonera'), comp = el('button', 'grande', 'Comprobar'), solb = el('button', 'suave', '👀 Ver solución'), borrar = el('button', 'suave', '🧽 Borrar');
  comp.addEventListener('click', () => {
    let bien = 0, total = 0, errores = 0;
    fichas.forEach(f => { f.classList.remove('ok', 'ko'); if (f.dataset.cat) total++;
      if (f.dataset.sel) { if (f.dataset.sel === f.dataset.cat) { f.classList.add('ok'); bien++; } else { f.classList.add('ko'); errores++; } } });
    fb.innerHTML = `✔️ ${bien} de ${total} bien` + (errores ? ` · ❌ ${errores} por revisar` : '');
    fb.style.color = bien === total && !errores ? 'var(--aciertoOsc)' : '#B45309';
    if (bien === total && !errores) { playSound('win'); confeti(); } else playSound(errores ? 'error' : 'success');
  });
  solb.addEventListener('click', () => { fichas.forEach(f => { f.classList.remove('ok', 'ko'); if (f.dataset.cat) { f.dataset.sel = f.dataset.cat; f.style.background = cats[f.dataset.cat].color; f.style.borderColor = cats[f.dataset.cat].borde; } else { f.dataset.sel = ''; f.style.background = ''; f.style.borderColor = 'transparent'; } }); fb.textContent = 'Así queda el texto subrayado.'; fb.style.color = 'var(--oscuro)'; });
  borrar.addEventListener('click', () => { fichas.forEach(f => { f.dataset.sel = ''; f.style.background = ''; f.style.borderColor = 'transparent'; f.classList.remove('ok', 'ko'); }); fb.textContent = ''; });
  selector.append(comp, solb, borrar);
  p.append(selector, fb, caja);
})();

// 4 · DESPUÉS: verdadero o falso
(() => {
  const p = nueva('vf');
  p.append(el('span', 'fase despues', 'Después de leer'), el('h2', '', '✅ ¿Verdadero o falso?'));

    const responder = val => {
      if (fila.dataset.hecha) return; fila.dataset.hecha = '1'; hechas++;
      const ok = val === item.v; if (ok) aciertos++;
      (val ? bv : bf).classList.add(ok ? 'bien' : 'mal'); if (!ok) (item.v ? bv : bf).classList.add('bien');
      nota.innerHTML = (ok ? '✔️ ¡Correcto!' : '❌ ¡Casi!') + (item.por ? ' ' + item.por : '');
      playSound(ok ? 'success' : 'error');
      if (hechas === CONFIG.verdaderoFalso.length) { res.innerHTML = `🏅 ${aciertos} de ${hechas} aciertos`; if (aciertos === hechas) { playSound('win'); confeti(); } }
    };
    bv.addEventListener('click', () => responder(true)); bf.addEventListener('click', () => responder(false));
    const bts = el('div', 'vfbts'); bts.append(bv, bf); fila.append(bts, nota); lista.append(fila);
  });
  const otra = el('button', 'suave', '🔁 Otra vez'); otra.addEventListener('click', () => { location.hash = '#vf'; location.reload(); });
  p.append(lista, res, otra);
})();

// 6 · DESPUÉS: une cada persona con lo que hacía
(() => {
  const p = nueva('unir');
  p.append(el('span', 'fase despues', 'Después de leer'), el('h2', '', '🔗 Une cada persona con lo que hacía'), el('div', 'txt', 'Toca una persona y después lo que hacía.'));
  const cont = el('div', 'unircont'), izq = el('div', 'unircol'), der = el('div', 'unircol'), fb = el('div', 'feedback');
  const colores = ['#BFDBFE', '#FDE68A', '#BBF7D0', '#FBCFE8'];
  let elegido = null, hechos = 0, bloqueado = false;
  const bl = CONFIG.unir.map(([n], i) => { const b = el('button', 'unirbtn', n); b.dataset.i = i; izq.append(b); return b; });
  const br = mezclar(CONFIG.unir.map(([, d], i) => [d, i])).map(([d, i]) => { const b = el('button', 'unirbtn', d); b.dataset.i = i; der.append(b); return b; });
  bl.forEach(b => b.addEventListener('click', () => { if (b.disabled || bloqueado) return; bl.forEach(x => x.classList.remove('sel')); b.classList.add('sel'); elegido = b; playSound('flip'); }));
  br.forEach(b => b.addEventListener('click', () => {
    if (b.disabled || !elegido || bloqueado) return;
    if (b.dataset.i === elegido.dataset.i) {
      const c = colores[hechos % colores.length]; [b, elegido].forEach(x => { x.style.background = c; x.disabled = true; x.classList.remove('sel'); x.classList.add('hecho'); });
      hechos++; elegido = null; playSound('success'); fb.innerHTML = '✔️ ¡Pareja correcta!'; fb.style.color = 'var(--aciertoOsc)';
      if (hechos === CONFIG.unir.length) { fb.innerHTML = '🏅 ¡Todas las parejas unidas!'; playSound('win'); confeti(); }
    } else {
      bloqueado = true; b.classList.add('malb'); playSound('error'); fb.innerHTML = '❌ Esa no es. ¡Prueba otra!'; fb.style.color = '#B91C1C';
      setTimeout(() => { b.classList.remove('malb'); bloqueado = false; }, 900);
    }
  }));
  cont.append(izq, der); p.append(cont, fb);
})();

// ---------- Navegación ----------
let actual = 0;
const btnAnt = document.getElementById('btnAnt'), btnSig = document.getElementById('btnSig'), prog = document.getElementById('prog'), puntos = document.getElementById('puntos');
pantallas.forEach(() => puntos.append(el('i')));
function ir(n) {
  actual = Math.max(0, Math.min(pantallas.length - 1, n));
  pantallas.forEach((p, i) => p.classList.toggle('activa', i === actual));
  btnAnt.disabled = actual === 0; btnSig.disabled = actual === pantallas.length - 1;
  prog.textContent = `Pantalla ${actual + 1} de ${pantallas.length}`;
  [...puntos.children].forEach((d, i) => d.classList.toggle('on', i <= actual));
  main.scrollTop = 0;
  try { history.replaceState(null, '', '#' + pantallas[actual].id); } catch (e) {}
}
btnAnt.addEventListener('click', () => ir(actual - 1));
btnSig.addEventListener('click', () => ir(actual + 1));
document.getElementById('btnCasa').addEventListener('click', () => ir(0));
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') ir(actual + 1); if (e.key === 'ArrowLeft') ir(actual - 1); });

// ---------- Marcador por equipos (se guarda en el navegador) ----------
const marcador = document.getElementById('marcador'), filas = document.getElementById('filas');
let pts = CONFIG.equipos.map(() => 0);
try { const g = JSON.parse(localStorage.getItem('galeria27_s1_puntos')); if (Array.isArray(g) && g.length === pts.length) pts = g; } catch (e) {}
function guardar() { try { localStorage.setItem('galeria27_s1_puntos', JSON.stringify(pts)); } catch (e) {} }
function pintarMarcador() {
  filas.innerHTML = '';
  CONFIG.equipos.forEach((n, i) => {
    const f = el('div', 'fila', `<span>${n}</span>`); const menos = el('button', '', '−'), pt = el('span', 'pt', pts[i]), mas = el('button', '', '+');
    menos.setAttribute('aria-label', 'Quitar punto a ' + n); mas.setAttribute('aria-label', 'Dar punto a ' + n);
    menos.addEventListener('click', () => { pts[i] = Math.max(0, pts[i] - 1); guardar(); pintarMarcador(); });
    mas.addEventListener('click', () => { pts[i]++; guardar(); pintarMarcador(); playSound('success'); });
    f.append(menos, pt, mas); filas.append(f);
  });
}
document.getElementById('btnMarcador').addEventListener('click', () => marcador.classList.toggle('ver'));
document.getElementById('btnReiniciarPuntos').addEventListener('click', () => { pts = pts.map(() => 0); guardar(); pintarMarcador(); });
pintarMarcador();

// Arranque (admite enlace directo: #galeria, #sigla…)
document.getElementById('titulo').textContent = CONFIG.titulo;
const inicial = pantallas.findIndex(p => '#' + p.id === location.hash);
ir(inicial > 0 ? inicial : 0);
