      --tertiary: #feca57;
      --tertiary-dark: #f39c12;

      --success: #1dd1a1;

    * {

      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      background-color: var(--primary);
      width: 100%;
      padding: 20px;
      text-align: center;
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.1);

    .container {
      width: 90%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      text-align: center;
    }

    /* Vistas */
    .view { display: none; }
    .view.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Menú Principal */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      margin-top: 20px;
    }

    .menu-btn {
      background-color: var(--tertiary);
      border: none;
      border-radius: 20px;
      padding: 30px 20px;
      font-size: 1.5rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 0 var(--tertiary-dark);
      transition: all 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    .menu-btn.game2 { background-color: var(--primary); box-shadow: 0 8px 0 var(--primary-dark); }
    .menu-btn.game3 { background-color: var(--secondary); box-shadow: 0 8px 0 var(--secondary-dark); }

    .menu-btn:active {

      box-shadow: 0 0px 0 transparent !important;
    }

    .emoji-icon { font-size: 4rem; }

    /* Juegos */

      justify-content: space-between;
      width: 100%;
      margin-bottom: 30px;
      align-items: center;

      border: none;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 0 #999;
      transition: transform 0.1s;

      font-weight: 800;
      color: var(--primary-dark);
      background: #e0f7fa;
      padding: 10px 20px;
      border-radius: 16px;

      font-size: 4rem;
      font-weight: 800;
      margin: 20px 0;
      letter-spacing: 2px;
      color: var(--text);
    }

    .options-grid {

      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;

      font-weight: 700;
      color: white;

      padding: 15px 30px;

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      
      if (type === 'success') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.5, now + 0.05);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'error') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.2);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.5, now + 0.05);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'win') {
        [400, 500, 600, 800].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.frequency.value = freq;
          g.gain.setValueAtTime(0, now + i*0.1);
          g.gain.linearRampToValueAtTime(0.3, now + i*0.1 + 0.05);
          g.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.3);
          o.start(now + i*0.1);
          o.stop(now + i*0.1 + 0.3);
        });
      }
    }

    function createConfetti() {
      const colors = ['#4ecdc4', '#ff6b6b', '#feca57', '#1dd1a1', '#54a0ff'];
      for (let i = 0; i < 50; i++) {
        const conf = document.createElement('div');
        conf.classList.add('confetti');
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 2500);
      }
    }

      { word: "pentágono", syllables: ["pen", "tá", "go", "no"], tonicIndex: 1, type: "esdrújula" },
      { word: "hexágono", syllables: ["he", "xá", "go", "no"], tonicIndex: 1, type: "esdrújula" },
      { word: "círculo", syllables: ["cír", "cu", "lo"], tonicIndex: 0, type: "esdrújula" },
      { word: "plástico", syllables: ["plás", "ti", "co"], tonicIndex: 0, type: "esdrújula" },
      { word: "pirámide", syllables: ["pi", "rá", "mi", "de"], tonicIndex: 1, type: "esdrújula" },
      { word: "oxígeno", syllables: ["o", "xí", "ge", "no"], tonicIndex: 1, type: "esdrújula" },
      { word: "relámpago", syllables: ["re", "lám", "pa", "go"], tonicIndex: 1, type: "esdrújula" },
      { word: "océano", syllables: ["o", "cé", "a", "no"], tonicIndex: 1, type: "esdrújula" },
      { word: "árboles", syllables: ["ár", "bo", "les"], tonicIndex: 0, type: "esdrújula" },
      { word: "cáscara", syllables: ["cás", "ca", "ra"], tonicIndex: 0, type: "esdrújula" },
      { word: "estómago", syllables: ["es", "tó", "ma", "go"], tonicIndex: 1, type: "esdrújula" },
      { word: "ídolo", syllables: ["í", "do", "lo"], tonicIndex: 0, type: "esdrújula" },
      { word: "pólvora", syllables: ["pól", "vo", "ra"], tonicIndex: 0, type: "esdrújula" },
      { word: "príncipe", syllables: ["prín", "ci", "pe"], tonicIndex: 0, type: "esdrújula" },
      { word: "propósito", syllables: ["pro", "pó", "si", "to"], tonicIndex: 1, type: "esdrújula" },
      { word: "sótano", syllables: ["só", "ta", "no"], tonicIndex: 0, type: "esdrújula" },
      { word: "término", syllables: ["tér", "mi", "no"], tonicIndex: 0, type: "esdrújula" },
      { word: "túneles", syllables: ["tú", "ne", "les"], tonicIndex: 0, type: "esdrújula" },
      { word: "vértice", syllables: ["vér", "ti", "ce"], tonicIndex: 0, type: "esdrújula" },
      { word: "víctima", syllables: ["víc", "ti", "ma"], tonicIndex: 0, type: "esdrújula" },
      { word: "cómodo", syllables: ["có", "mo", "do"], tonicIndex: 0, type: "esdrújula" },
      { word: "ridículo", syllables: ["ri", "dí", "cu", "lo"], tonicIndex: 1, type: "esdrújula" },
      { word: "bolígrafo", syllables: ["bo", "lí", "gra", "fo"], tonicIndex: 1, type: "esdrújula" }
    ];

    let currentGame = 0;
    let currentWordObj = null;
    let score = 0;
    let turn = 0;
    const maxTurns = 10;
    let availableWords = [];

    // Función Fisher-Yates para barajar el array de forma 100% aleatoria
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function showMenu() {
      document.getElementById('view-game').classList.remove('active');
      document.getElementById('view-menu').classList.add('active');
    }

    function startGame(gameId) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      currentGame = gameId;
      score = 0;
      turn = 0;
      
      // Barajado profesional y verdadero para que las palabras salgan aleatorias de verdad
      availableWords = shuffleArray([...dbWords]);
      
      document.getElementById('view-menu').classList.remove('active');
      document.getElementById('view-game').classList.add('active');
      
      updateScoreUI();
      nextTurn();
    }

    function nextTurn() {
      if (turn >= maxTurns) {
        playSound('win');
        createConfetti();
        setTimeout(() => {
          alert(`¡Juego Terminado! Has conseguido ${score} estrellas de ${maxTurns}.`);
          showMenu();
        }, 800);
        return;
      }

      currentWordObj = availableWords[turn];
      const wordDisplay = document.getElementById('word-display');
      const optionsContainer = document.getElementById('options-container');
      const instruction = document.getElementById('instruction-text');
      const gameTitle = document.getElementById('game-title');
      
      optionsContainer.innerHTML = '';

      if (currentGame === 1) {
        gameTitle.innerText = "Cuenta Sílabas";
        instruction.innerText = "¿Cuántas sílabas tiene esta palabra?";
        wordDisplay.innerText = currentWordObj.word.toUpperCase();
        
        for(let i=1; i<=5; i++) {
          const btn = document.createElement('button');
          btn.className = 'option-btn btn-default';
          btn.innerText = i;
          btn.onclick = (e) => checkAnswer(i === currentWordObj.syllables.length, e.target);
          optionsContainer.appendChild(btn);
        }
      } 
      else if (currentGame === 2) {
        gameTitle.innerText = "Atrapa la Tónica";
        instruction.innerText = "Toca la sílaba que suena MÁS FUERTE (sílaba tónica)";
        wordDisplay.innerText = ""; // Ocultamos la palabra entera para mostrarla dividida
        
        currentWordObj.syllables.forEach((syl, index) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn btn-syllable';
          btn.innerText = syl.toUpperCase();
          btn.onclick = (e) => checkAnswer(index === currentWordObj.tonicIndex, e.target);
          optionsContainer.appendChild(btn);
        });
      }
      else if (currentGame === 3) {
        gameTitle.innerText = "¿Aguda, Llana o Esdrújula?";
        instruction.innerText = "¿Qué tipo de palabra es?";
        wordDisplay.innerText = currentWordObj.syllables.join('-').toUpperCase();
        
        const classifications = [
          { type: "aguda", text: "AGUDA", css: "classify-aguda" },
          { type: "llana", text: "LLANA", css: "classify-llana" },
          { type: "esdrújula", text: "ESDRÚJULA", css: "classify-esdrujula" }
        ];

        classifications.forEach(item => {
          const btn = document.createElement('button');
          btn.className = `option-btn ${item.css}`;
          btn.innerText = item.text;
          btn.onclick = (e) => checkAnswer(item.type === currentWordObj.type, e.target);
          optionsContainer.appendChild(btn);
        });
      }
    }

    function checkAnswer(isCorrect, btnElement) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.style.pointerEvents = 'none'); // Bloquea los botones durante la animación

      if (isCorrect) {
        playSound('success');
        btnElement.classList.add('correct-anim');
        score++;
      } else {
        playSound('error');
        btnElement.classList.add('error-anim');
        
        // Muestra la correcta en verde
        if (currentGame === 1) {
          allBtns[currentWordObj.syllables.length - 1].classList.add('correct-anim');
        } else if (currentGame === 2) {
          allBtns[currentWordObj.tonicIndex].classList.add('correct-anim');
        } else if (currentGame === 3) {
          const correctIdx = ["aguda", "llana", "esdrújula"].indexOf(currentWordObj.type);
          allBtns[correctIdx].classList.add('correct-anim');
        }
      }

      updateScoreUI();

      setTimeout(() => {
        turn++;
        nextTurn();
      }, 1500);
    }

    function updateScoreUI() {
      document.getElementById('score-display').innerText = score;
    }
  </script>
</body>
</html>
