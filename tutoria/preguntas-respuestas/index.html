<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego Educativo Interactivo</title>
    <!-- Tipografía escolar amigable -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* === VARIABLES DE COLOR PASTEL Y DISEÑO === */
        :root {
            --bg-main: #F0F8FF;       /* Azul hielo muy suave */
            --primary: #FFB347;       /* Naranja pastel (Botones principales) */
            --primary-dark: #FF9800;
            --secondary: #AEC6CF;     /* Azul pastel */
            --success: #77DD77;       /* Verde pastel (Acierto) */
            --danger: #FF6961;        /* Rojo pastel (Error) */
            --text-dark: #2C3E50;     /* Texto oscuro para máximo contraste */
            --text-light: #FFFFFF;
            --shadow: 0 8px 16px rgba(0,0,0,0.1);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none; /* Evitar seleccionar texto al jugar */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Evitar scroll en MDI/Tablet */
        }

        /* === CONTENEDORES PRINCIPALES === */
        .view {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding: 2vw;
            animation: fadeIn 0.4s ease;
        }
        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* === BOTÓN FLOTANTE (CAMBIO DE MODO) === */
        .mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: 3px solid var(--secondary);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 30px;
            cursor: pointer;
            z-index: 100;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mode-toggle:active { transform: scale(0.9); }

        /* =========================================
           VISTA 1: JUEGO (ALUMNADO)
           ========================================= */
        #game-view {
            justify-content: center;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .score-board {
            font-size: 2rem;
            font-weight: 900;
            color: var(--secondary);
            margin-bottom: 20px;
            background: white;
            padding: 10px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .question-card {
            background: white;
            width: 100%;
            padding: 40px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            margin-bottom: 30px;
            border: 6px solid var(--primary);
        }

        .question-text {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-dark);
            line-height: 1.2;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
        }

        /* Botones de respuesta enormes */
        .option-btn {
            background-color: white;
            border: 4px solid var(--secondary);
            border-radius: var(--radius);
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-dark);
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 120px; /* Accesibilidad MDI */
            box-shadow: 0 6px 0 var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 var(--secondary);
        }

        /* Estados de respuesta */
        .option-btn.correct {
            background-color: var(--success);
            border-color: #55B555;
            color: white;
            box-shadow: 0 6px 0 #55B555;
            animation: pop 0.4s ease;
        }
        .option-btn.incorrect {
            background-color: var(--danger);
            border-color: #D6453E;
            color: white;
            box-shadow: 0 6px 0 #D6453E;
            animation: shake 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        /* =========================================
           VISTA 2: CONFIGURACIÓN (PROFESORADO)
           ========================================= */
        #teacher-view {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 900px;
            margin: 40px auto;
            padding: 40px;
            overflow-y: auto;
        }

        h1 { font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 10px; }
        p { font-size: 1.2rem; color: #666; margin-bottom: 30px; }

        .json-controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 800;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            transition: filter 0.2s;
            min-height: 70px;
        }
        .action-btn:hover { filter: brightness(1.1); }
        
        .btn-download { background-color: var(--success); }
        .btn-upload { background-color: var(--primary-dark); }
        
        input[type="file"] { display: none; }

        .preview-box {
            background: var(--bg-main);
            padding: 20px;
            border-radius: 16px;
            border: 3px dashed var(--secondary);
        }
        .preview-box h3 { font-size: 1.5rem; margin-bottom: 15px; }
        .q-list { list-style: none; font-size: 1.2rem; }
        .q-list li { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #ccc; }

        /* Media Queries para Tablet vertical/Móvil grande */
        @media (max-width: 768px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 2rem; }
            .option-btn { min-height: 90px; padding: 15px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Botón para alternar entre Alumno y Profesor -->
    <button class="mode-toggle" onclick="toggleMode()" title="Cambiar a Modo Profe">⚙️</button>

    <!-- =========================================================
         VISTA DEL ALUMNO (JUEGO INTERACTIVO)
         ========================================================= -->
    <div id="game-view" class="view active">
        <div class="score-board">⭐ Puntos: <span id="score-display">0</span></div>
        
        <div class="question-card">
            <div id="question-text" class="question-text">Cargando...</div>
        </div>

        <div class="options-grid" id="options-container">
            <!-- Los botones se generan dinámicamente con JS -->
        </div>
    </div>

    <!-- =========================================================
         VISTA DEL PROFESOR (GESTIÓN DE DATOS JSON)
         ========================================================= -->
    <div id="teacher-view" class="view">
        <h1>👩🏻‍🏫 Panel del Docente</h1>
        <p>Carga un archivo JSON con tus preguntas personalizadas o descarga la plantilla actual para editarla en tu ordenador.</p>
        
        <div class="json-controls">
            <!-- Botón para descargar -->
            <button class="action-btn btn-download" onclick="exportJSON()">
                📥 Guardar (Descargar JSON)
            </button>
            
            <!-- Botón para cargar (Input oculto) -->
            <label class="action-btn btn-upload">
                📂 Cargar archivo JSON
                <input type="file" accept=".json" onchange="importJSON(event)">
            </label>
        </div>

        <div class="preview-box">
            <h3>Preguntas cargadas actualmente (<span id="q-count">0</span>):</h3>
            <ul class="q-list" id="q-list">
                <!-- Lista de preguntas generada por JS -->
            </ul>
        </div>
        
        <!-- Enlace oculto necesario para la descarga -->
        <a id="downloadAnchorElem" style="display:none"></a>
    </div>

    <!-- =========================================================
         LÓGICA JAVASCRIPT
         ========================================================= -->
    <script>
        /* --- DATOS POR DEFECTO (Ejemplo 3º Primaria) --- */
        // Este es el array que se guarda/carga en el JSON
        let quizData = [
            { question: "¿Cuánto es 8 x 4?", options: ["24", "32", "36", "40"], correctIndex: 1 },
            { question: "¿Cuál de estas palabras es un verbo?", options: ["Rojo", "Mesa", "Correr", "Gato"], correctIndex: 2 },
            { question: "El agua en estado sólido es...", options: ["Vapor", "Lluvia", "Hielo", "Nube"], correctIndex: 2 },
            { question: "¿Cuántas sílabas tiene 'Elefante'?", options: ["Dos", "Tres", "Cuatro", "Cinco"], correctIndex: 2 }
        ];

        /* --- VARIABLES DE ESTADO --- */
        let currentQuestion = 0;
        let score = 0;
        let isWaiting = false; // Evita que pulsen varias veces
        let isTeacherMode = false;

        /* --- MOTOR DE AUDIO NATIVO (Web Audio API) --- */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'success') {
                // Sonido alegre y agudo (Acierto)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.2); // A5
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'error') {
                // Sonido grave (Fallo)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        /* --- LÓGICA DEL JUEGO --- */
        function loadQuestion() {
            if(quizData.length === 0) {
                document.getElementById('question-text').innerText = "¡Sube preguntas en el modo Profe!";
                document.getElementById('options-container').innerHTML = "";
                return;
            }

            isWaiting = false;
            const q = quizData[currentQuestion];
            document.getElementById('question-text').innerText = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = ""; // Limpiar opciones anteriores

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isWaiting) return;
            isWaiting = true;

            const q = quizData[currentQuestion];
            const allButtons = document.querySelectorAll('.option-btn');

            if (selectedIndex === q.correctIndex) {
                // Acierto
                btnElement.classList.add('correct');
                playSound('success');
                score += 10;
                document.getElementById('score-display').innerText = score;
            } else {
                // Fallo
                btnElement.classList.add('incorrect');
                allButtons[q.correctIndex].classList.add('correct'); // Mostrar cuál era la correcta
                playSound('error');
            }

            // Pasar a la siguiente pregunta tras 2 segundos
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion >= quizData.length) {
                    currentQuestion = 0; // Reiniciar juego (bucle infinito para centros de aprendizaje)
                    // Opcional: Podrías añadir una pantalla de "Fin de juego" aquí
                }
                loadQuestion();
            }, 2000);
        }

        /* --- NAVEGACIÓN --- */
        function toggleMode() {
            isTeacherMode = !isTeacherMode;
            const btn = document.querySelector('.mode-toggle');
            
            if (isTeacherMode) {
                document.getElementById('game-view').classList.remove('active');
                document.getElementById('teacher-view').classList.add('active');
                btn.innerText = "🎮";
                btn.title = "Volver al Juego";
                updateTeacherView();
            } else {
                document.getElementById('teacher-view').classList.remove('active');
                document.getElementById('game-view').classList.add('active');
                btn.innerText = "⚙️";
                btn.title = "Modo Profe";
                // Reiniciar juego con los datos actualizados
                currentQuestion = 0;
                score = 0;
                document.getElementById('score-display').innerText = score;
                loadQuestion();
            }
        }

        /* --- LÓGICA DE GUARDAR / CARGAR JSON --- */
        
        // Actualiza la lista visible en el panel del profe
        function updateTeacherView() {
            document.getElementById('q-count').innerText = quizData.length;
            const list = document.getElementById('q-list');
            list.innerHTML = "";
            quizData.forEach((q, i) => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${i+1}. ${q.question}</strong><br>
                                <span style="color:var(--success);">✅ ${q.options[q.correctIndex]}</span>`;
                list.appendChild(li);
            });
        }

        // EXPORTAR: Crea un Blob con el array y fuerza la descarga
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quizData, null, 2));
            const dlAnchorElem = document.getElementById('downloadAnchorElem');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "preguntas_tercero.json");
            dlAnchorElem.click();
            alert("✅ Archivo JSON descargado. Ábrelo con el Bloc de notas para añadir o cambiar preguntas.");
        }

        // IMPORTAR: Lee el archivo, lo parsea y reemplaza el array
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsedData = JSON.parse(e.target.result);
                    // Validación básica
                    if (Array.isArray(parsedData) && parsedData.length > 0 && parsedData[0].question) {
                        quizData = parsedData;
                        updateTeacherView();
                        alert("✅ Preguntas cargadas correctamente.");
                    } else {
                        alert("❌ El formato del archivo no es correcto.");
                    }
                } catch (error) {
                    alert("❌ Error al leer el archivo JSON. Asegúrate de que está bien escrito.");
                }
            };
            reader.readAsText(file);
            // Resetear el input para permitir cargar el mismo archivo tras modificarlo
            event.target.value = '';
        }

        /* --- INICIALIZAR --- */
        window.onload = () => {
            loadQuestion();
        };

    </script>
</body>
</html>
