<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Atasco! - Aventura Matemática</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #e0f2fe; /* Light sky blue */
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden; /* Prevent pull-to-refresh on mobile/boards */
        }

        /* Prevent scrolling when dragging cars */
        .board-container {
            touch-action: none;
            background: #cbd5e1;
            border: 8px solid #475569;
            border-radius: 12px;
            position: relative;
            aspect-ratio: 1 / 1;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 0 10px 25px rgba(0,0,0,0.2);
        }

        /* The Exit */
        .exit-gate {
            position: absolute;
            right: -10px;
            top: 33.33%; /* Row 2 (0, 1, 2) out of 6 -> 2/6 = 33.33% */
            height: 16.66%;
            width: 10px;
            background: repeating-linear-gradient(
                45deg,
                #fbbf24,
                #fbbf24 10px,
                #000000 10px,
                #000000 20px
            );
            border-radius: 0 8px 8px 0;
            z-index: 10;
        }

        /* Grid lines */
        .grid-lines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            pointer-events: none;
        }

        .grid-cell {
            border: 1px dashed rgba(255, 255, 255, 0.4);
        }

        .vehicle {
            position: absolute;
            border-radius: 12px;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0,0,0,0.2);
        }

        .vehicle:active {
            cursor: grabbing;
            transform: scale(1.02);
            z-index: 20;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
        }

        /* Vehicle details to look like cute cars */
        .vehicle::before, .vehicle::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 4px;
        }

        /* Horizontal car windows */
        .vehicle.dir-H::before { width: 20%; height: 60%; left: 15%; }
        .vehicle.dir-H::after { width: 20%; height: 60%; right: 15%; }
        
        /* Vertical car windows */
        .vehicle.dir-V::before { width: 60%; height: 20%; top: 15%; }
        .vehicle.dir-V::after { width: 60%; height: 20%; bottom: 15%; }

        .hero-car {
            background: linear-gradient(135deg, #ef4444, #b91c1c); /* Red */
        }
        
        .hero-car::after {
            content: '⭐';
            font-size: 1.5rem;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .car-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .car-green { background: linear-gradient(135deg, #22c55e, #15803d); }
        .car-yellow { background: linear-gradient(135deg, #eab308, #a16207); }
        .truck-purple { background: linear-gradient(135deg, #a855f7, #6b21a8); }
        .truck-orange { background: linear-gradient(135deg, #f97316, #c2410c); }

        .modal-overlay {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
        }
        
        .btn-bouncy {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-bouncy:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center overflow-hidden">

    <!-- MAIN MENU -->
    <div id="screen-menu" class="w-full h-full flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-2xl border-4 border-blue-400 w-full">
            <h1 class="text-5xl md:text-6xl font-black text-blue-600 mb-2 drop-shadow-md">¡ATASCO!</h1>
            <p class="text-xl text-gray-600 mb-6 font-bold">Ayuda al coche estrella a salir por la puerta</p>
            
            <!-- Difficulty Selector -->
            <div class="flex items-center justify-center gap-2 md:gap-4 mb-8 bg-gray-100 p-2 rounded-2xl w-max mx-auto border-2 border-gray-200">
                <span class="font-bold text-gray-600 ml-2 hidden md:inline">Dificultad:</span>
                <button id="btn-diff-normal" onclick="setDifficulty('normal')" class="px-6 py-2 rounded-xl font-black bg-green-500 text-white shadow-md transform scale-105 transition-all">
                    Normal 🟢
                </button>
                <button id="btn-diff-pro" onclick="setDifficulty('pro')" class="px-6 py-2 rounded-xl font-bold bg-white text-gray-500 hover:bg-red-50 transition-all">
                    PRO 🔥
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <button onclick="startGame('individual')" class="btn-bouncy bg-green-500 hover:bg-green-600 text-white rounded-2xl p-6 shadow-lg border-b-4 border-green-700 flex flex-col items-center">
                    <span class="text-4xl mb-2">🧑‍🚀</span>
                    <span class="text-xl font-black">Juego Libre</span>
                    <span class="text-sm font-semibold mt-1">Niveles infinitos</span>
                </button>
                
                <button onclick="startGame('challenge')" class="btn-bouncy bg-yellow-400 hover:bg-yellow-500 text-white rounded-2xl p-6 shadow-lg border-b-4 border-yellow-600 flex flex-col items-center">
                    <span class="text-4xl mb-2">⏱️</span>
                    <span class="text-xl font-black">Reto Reloj</span>
                    <span class="text-sm font-semibold mt-1">Contra el tiempo</span>
                </button>

                <button onclick="startGame('versus')" class="btn-bouncy bg-purple-500 hover:bg-purple-600 text-white rounded-2xl p-6 shadow-lg border-b-4 border-purple-700 flex flex-col items-center">
                    <span class="text-4xl mb-2">⚔️</span>
                    <span class="text-xl font-black">Reto Doble</span>
                    <span class="text-sm font-semibold mt-1">2 Jugadores</span>
                </button>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" class="w-full h-full hidden flex-col">
        <!-- Header -->
        <div class="bg-white shadow-md p-4 flex justify-between items-center z-10">
            <button onclick="returnToMenu()" class="btn-bouncy bg-red-500 text-white font-bold py-2 px-6 rounded-full shadow border-b-4 border-red-700 text-lg">
                ⬅️ Salir
            </button>
            <div class="text-center">
                <h2 id="game-title" class="text-2xl font-black text-blue-600 uppercase">Modo de Juego</h2>
                <p id="level-indicator" class="text-gray-500 font-bold">Nivel 1</p>
            </div>
            <div class="bg-gray-800 text-white font-mono font-bold text-2xl py-2 px-6 rounded-xl border-4 border-gray-600 shadow-inner flex items-center gap-2">
                ⏳ <span id="timer-display">00:00</span>
            </div>
        </div>

        <!-- Boards Area -->
        <div id="boards-container" class="flex-1 flex flex-col md:flex-row items-center justify-center gap-4 md:gap-12 p-4 md:p-8 bg-blue-50">
            <!-- Board 1 -->
            <div id="board-1-wrapper" class="w-full max-w-md md:max-w-xl hidden flex-col items-center">
                <h3 id="board-1-title" class="text-xl font-bold text-gray-700 mb-2 hidden">Jugador 1</h3>
                <div id="board-1" class="board-container w-full">
                    <div class="grid-lines" id="grid-1"></div>
                    <div class="exit-gate"></div>
                    <!-- Cars injected here -->
                </div>
            </div>

            <!-- Board 2 (Only for Versus) -->
            <div id="board-2-wrapper" class="w-full max-w-md md:max-w-xl hidden flex-col items-center">
                <h3 id="board-2-title" class="text-xl font-bold text-gray-700 mb-2">Jugador 2</h3>
                <div id="board-2" class="board-container w-full">
                    <div class="grid-lines" id="grid-2"></div>
                    <div class="exit-gate"></div>
                    <!-- Cars injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL / FEEDBACK -->
    <div id="modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-lg transform scale-95 transition-transform duration-300 border-4 border-yellow-400" id="modal-content">
            <div id="modal-icon" class="text-7xl mb-4">🏆</div>
            <h2 id="modal-title" class="text-4xl font-black text-gray-800 mb-4">¡Nivel Superado!</h2>
            <p id="modal-message" class="text-xl text-gray-600 font-bold mb-8">¡Lo has hecho genial!</p>
            <button id="modal-btn" class="btn-bouncy bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full shadow-lg border-b-4 border-blue-700 text-xl w-full">
                Siguiente Nivel ➡️
            </button>
        </div>
    </div>

    <script>
        // --- GLOBAL STATE ---
        let currentMode = '';
        let currentLevelIndex = 0;
        let timerInterval = null;
        let timeSeconds = 0;
        let gameActive = false;
        let currentDifficulty = 'normal'; // 'normal' o 'pro'
        
        let board1 = null;
        let board2 = null;

        // --- LEVEL GENERATOR & SOLVER ---
        function createRandomLevel() {
            let level = null;
            let attempts = 0;
            // Damos más intentos en modo PRO porque encontrar un puzzle resoluble con alta complejidad es estadísticamente más raro
            const maxAttempts = currentDifficulty === 'pro' ? 100 : 50; 
            
            while (!level && attempts < maxAttempts) {
                attempts++;
                const candidate = generateRandomCandidate(currentDifficulty);
                if (isSolvableAndChallenging(candidate, currentDifficulty)) {
                    level = candidate;
                }
            }
            
            // Mapas de respaldo en caso de que la aleatoriedad no encuentre solución a tiempo
            if (!level) {
                if (currentDifficulty === 'pro') {
                    // Mapa PRO genérico difícil garantizado
                    level = [
                        { id: 'hero', color: 'hero-car', x: 0, y: 2, len: 2, dir: 'H', isHero: true },
                        { id: 'c1', color: 'car-green', x: 3, y: 1, len: 3, dir: 'V' }, // blocker
                        { id: 't1', color: 'truck-purple', x: 0, y: 0, len: 3, dir: 'H' },
                        { id: 't2', color: 'truck-orange', x: 0, y: 3, len: 3, dir: 'V' },
                        { id: 'c2', color: 'car-blue', x: 1, y: 4, len: 2, dir: 'H' },
                        { id: 'c3', color: 'car-yellow', x: 4, y: 4, len: 2, dir: 'V' },
                        { id: 't3', color: 'truck-purple', x: 5, y: 0, len: 3, dir: 'V' },
                        { id: 'c4', color: 'car-green', x: 3, y: 0, len: 2, dir: 'H' }
                    ];
                } else {
                    // Mapa Normal genérico
                    level = [
                        { id: 'hero', color: 'hero-car', x: 0, y: 2, len: 2, dir: 'H', isHero: true },
                        { id: 'c1', color: 'car-green', x: 2, y: 1, len: 2, dir: 'V' },
                        { id: 'c2', color: 'car-blue', x: 3, y: 0, len: 2, dir: 'H' },
                        { id: 't1', color: 'truck-purple', x: 5, y: 0, len: 3, dir: 'V' },
                        { id: 't2', color: 'truck-orange', x: 3, y: 3, len: 3, dir: 'H' },
                        { id: 'c3', color: 'car-yellow', x: 2, y: 4, len: 2, dir: 'H' }
                    ];
                }
            }
            return level;
        }

        function generateRandomCandidate(difficulty) {
            const vehicles = [];
            const grid = Array(6).fill().map(() => Array(6).fill(null));

            function addVehicle(v) {
                if (v.dir === 'H' && v.x + v.len > 6) return false;
                if (v.dir === 'V' && v.y + v.len > 6) return false;
                for (let i = 0; i < v.len; i++) {
                    if (v.dir === 'H' && grid[v.y][v.x + i] !== null) return false;
                    if (v.dir === 'V' && grid[v.y + i][v.x] !== null) return false;
                }
                for (let i = 0; i < v.len; i++) {
                    if (v.dir === 'H') grid[v.y][v.x + i] = v.id;
                    if (v.dir === 'V') grid[v.y + i][v.x] = v.id;
                }
                vehicles.push(v);
                return true;
            }

            // 1. Coche protagonista
            const heroX = Math.floor(Math.random() * 2); 
            addVehicle({ id: 'hero', color: 'hero-car', x: heroX, y: 2, len: 2, dir: 'H', isHero: true });

            // 2. Obstáculo frente al protagonista
            const blockerX = heroX + 2 + Math.floor(Math.random() * (4 - heroX)); 
            const blockerY = Math.floor(Math.random() * 2); 
            const blockerLen = Math.random() > 0.5 ? 2 : 3;
            addVehicle({ id: 'v1', color: 'car-green', x: blockerX, y: blockerY, len: blockerLen, dir: 'V' });

            // 3. Más vehículos
            const colors = ['car-blue', 'car-yellow', 'truck-purple', 'truck-orange', 'car-green'];
            let vId = 2;
            
            // Dificultad determina la cantidad de vehículos en el tablero
            let minVehicles = 5;
            let maxVehicles = 8;
            if (difficulty === 'pro') {
                minVehicles = 8;
                maxVehicles = 11;
            }
            
            const targetCount = Math.floor(Math.random() * (maxVehicles - minVehicles + 1)) + minVehicles; 
            
            for (let i = 0; i < 25 && vehicles.length < targetCount; i++) {
                const isTruck = Math.random() > 0.4;
                const len = isTruck ? 3 : 2;
                const dir = Math.random() > 0.5 ? 'H' : 'V';
                const x = Math.floor(Math.random() * 6);
                const y = Math.floor(Math.random() * 6);
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                if (addVehicle({ id: `v${vId}`, color, x, y, len, dir })) {
                    vId++;
                }
            }
            return vehicles;
        }

        function isSolvableAndChallenging(initialVehicles, difficulty) {
            if (initialVehicles.length < 5) return false; 

            // Configurar umbrales según dificultad
            const minDepthReq = difficulty === 'pro' ? 14 : 6;
            const maxNodesLimit = difficulty === 'pro' ? 12000 : 3000;

            const heroIdx = initialVehicles.findIndex(v => v.isHero);
            const info = initialVehicles.map(v => ({
                isH: v.dir === 'H',
                fixed: v.dir === 'H' ? v.y : v.x,
                len: v.len
            }));

            const startState = initialVehicles.map(v => v.dir === 'H' ? v.x : v.y);
            const queue = [{ state: startState, depth: 0 }];
            const visited = new Set([startState.join(',')]);

            let nodes = 0;
            
            while(queue.length > 0) {
                const { state, depth } = queue.shift();
                nodes++;
                
                // Evitamos bloqueos de pantalla cortando búsquedas demasiado extensas
                if (nodes > maxNodesLimit) return false; 

                if (state[heroIdx] === 4) {
                    return depth >= minDepthReq; 
                }

                const grid = Array(6).fill().map(() => Array(6).fill(0));
                for (let i = 0; i < state.length; i++) {
                    const inf = info[i];
                    const pos = state[i];
                    for (let j = 0; j < inf.len; j++) {
                        if (inf.isH) grid[inf.fixed][pos + j] = 1;
                        else grid[pos + j][inf.fixed] = 1;
                    }
                }

                for (let i = 0; i < state.length; i++) {
                    const inf = info[i];
                    const pos = state[i];
                    
                    if (pos > 0) {
                        if (inf.isH && grid[inf.fixed][pos - 1] === 0) {
                            const next = [...state]; next[i] = pos - 1;
                            const hash = next.join(',');
                            if (!visited.has(hash)) { visited.add(hash); queue.push({state: next, depth: depth+1}); }
                        } else if (!inf.isH && grid[pos - 1][inf.fixed] === 0) {
                            const next = [...state]; next[i] = pos - 1;
                            const hash = next.join(',');
                            if (!visited.has(hash)) { visited.add(hash); queue.push({state: next, depth: depth+1}); }
                        }
                    }
                    
                    if (pos + inf.len < 6) {
                        if (inf.isH && grid[inf.fixed][pos + inf.len] === 0) {
                            const next = [...state]; next[i] = pos + 1;
                            const hash = next.join(',');
                            if (!visited.has(hash)) { visited.add(hash); queue.push({state: next, depth: depth+1}); }
                        } else if (!inf.isH && grid[pos + inf.len][inf.fixed] === 0) {
                            const next = [...state]; next[i] = pos + 1;
                            const hash = next.join(',');
                            if (!visited.has(hash)) { visited.add(hash); queue.push({state: next, depth: depth+1}); }
                        }
                    }
                }
            }
            return false; 
        }

        // --- Motivational Messages ---
        const winMessages = [
            "¡Eres un genio!",
            "¡Trabajo fantástico!",
            "¡Cerebro en forma!",
            "¡Mente brillante!",
            "¡Súper estrategia!",
            "¡Increíble lógica!"
        ];

        // --- UTILS ---
        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function getRandomWinMessage() {
            return winMessages[Math.floor(Math.random() * winMessages.length)];
        }

        // --- UI NAVIGATION ---
        function setDifficulty(level) {
            currentDifficulty = level;
            const btnNormal = document.getElementById('btn-diff-normal');
            const btnPro = document.getElementById('btn-diff-pro');
            
            if (level === 'normal') {
                btnNormal.className = "px-6 py-2 rounded-xl font-black bg-green-500 text-white shadow-md transform scale-105 transition-all";
                btnPro.className = "px-6 py-2 rounded-xl font-bold bg-white text-gray-500 hover:bg-red-50 transition-all";
            } else {
                btnPro.className = "px-6 py-2 rounded-xl font-black bg-red-500 text-white shadow-md transform scale-105 transition-all";
                btnNormal.className = "px-6 py-2 rounded-xl font-bold bg-white text-gray-500 hover:bg-green-50 transition-all";
            }
        }

        function showScreen(screenId) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('modal').classList.add('hidden');
            
            document.getElementById(screenId).classList.remove('hidden');
            if(screenId === 'screen-game') {
                document.getElementById('screen-game').classList.add('flex');
            }
        }

        function returnToMenu() {
            clearInterval(timerInterval);
            gameActive = false;
            showScreen('screen-menu');
        }

        function showModal(title, message, icon, btnText, btnAction) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            
            const btn = document.getElementById('modal-btn');
            btn.innerText = btnText;
            btn.onclick = () => {
                modal.classList.add('hidden');
                btnAction();
            };
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        // --- GAME LOOP & MODES ---
        function startGame(mode) {
            currentMode = mode;
            currentLevelIndex = 0;
            gameActive = true;
            
            const b1Wrap = document.getElementById('board-1-wrapper');
            const b2Wrap = document.getElementById('board-2-wrapper');
            const title = document.getElementById('game-title');
            
            b1Wrap.classList.remove('hidden');
            b1Wrap.classList.add('flex');
            
            document.getElementById('grid-1').innerHTML = Array(36).fill('<div class="grid-cell"></div>').join('');
            document.getElementById('grid-2').innerHTML = Array(36).fill('<div class="grid-cell"></div>').join('');

            if (mode === 'individual' || mode === 'challenge') {
                b2Wrap.classList.add('hidden');
                b2Wrap.classList.remove('flex');
                document.getElementById('board-1-title').classList.add('hidden');
            } 
            else if (mode === 'versus') {
                b2Wrap.classList.remove('hidden');
                b2Wrap.classList.add('flex');
                document.getElementById('board-1-title').classList.remove('hidden');
            }

            showScreen('screen-game');

            setTimeout(() => {
                const difIndicator = currentDifficulty === 'pro' ? ' 🔥' : '';
                if (mode === 'individual') {
                    title.innerText = "Juego Libre" + difIndicator;
                    timeSeconds = 0;
                    startTimer(true); 
                    loadLevel(currentLevelIndex);
                } 
                else if (mode === 'challenge') {
                    title.innerText = "Reto Reloj" + difIndicator;
                    timeSeconds = currentDifficulty === 'pro' ? 180 : 120; // 3 min para PRO, 2 min Normal
                    startTimer(false); 
                    loadLevel(currentLevelIndex);
                } 
                else if (mode === 'versus') {
                    title.innerText = "Reto Doble" + difIndicator;
                    timeSeconds = 0;
                    startTimer(true);
                    loadVersusLevel(currentLevelIndex);
                }
            }, 50);
        }

        function startTimer(countUp) {
            clearInterval(timerInterval);
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                
                if (countUp) {
                    timeSeconds++;
                } else {
                    timeSeconds--;
                    if (timeSeconds <= 0) {
                        clearInterval(timerInterval);
                        gameActive = false;
                        showModal("¡Tiempo agotado!", "No te rindas, vuelve a intentarlo.", "⏳", "Volver al Menú", returnToMenu);
                        return;
                    }
                }
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer-display').innerText = formatTime(timeSeconds);
        }

        function loadLevel(index) {
            document.getElementById('level-indicator').innerText = `Nivel ${index + 1}`;
            const levelData = createRandomLevel();
            board1 = new GameBoard('board-1', levelData, () => onWinSingle(1));
        }

        function loadVersusLevel(index) {
            document.getElementById('level-indicator').innerText = `Nivel ${index + 1}`;
            const levelData = createRandomLevel();
            const levelData1 = JSON.parse(JSON.stringify(levelData));
            const levelData2 = JSON.parse(JSON.stringify(levelData));
            
            board1 = new GameBoard('board-1', levelData1, () => onWinVersus(1));
            board2 = new GameBoard('board-2', levelData2, () => onWinVersus(2));
        }

        function onWinSingle(player) {
            gameActive = false;
            if (currentMode === 'challenge') {
                clearInterval(timerInterval);
            }

            showModal("¡Nivel Superado!", getRandomWinMessage(), "⭐", "Siguiente Nivel ➡️", () => {
                currentLevelIndex++;
                gameActive = true;
                if (currentMode === 'challenge') startTimer(false); // resume
                loadLevel(currentLevelIndex);
            });
        }

        function onWinVersus(winnerNum) {
            gameActive = false;
            clearInterval(timerInterval);
            board1.disable();
            board2.disable();
            
            showModal(`¡Ganó el Jugador ${winnerNum}!`, "¡Qué rapidez! Excelente competencia.", winnerNum === 1 ? "🥇" : "🥈", "Siguiente Nivel ➡️", () => {
                currentLevelIndex++;
                gameActive = true;
                startTimer(true);
                loadVersusLevel(currentLevelIndex);
            });
        }

        // --- GAME LOGIC (Board Class) ---
        class GameBoard {
            constructor(containerId, vehicles, onWinCallback) {
                this.container = document.getElementById(containerId);
                this.vehicles = vehicles;
                this.onWin = onWinCallback;
                this.disabled = false;
                
                const oldVehicles = this.container.querySelectorAll('.vehicle');
                oldVehicles.forEach(v => v.remove());

                this.cellSize = 0;
                this.draggingVehicle = null;
                this.dragStartObj = null;

                this.render();
                
                window.addEventListener('resize', () => this.render());
            }

            disable() {
                this.disabled = true;
            }

            render() {
                const rect = this.container.getBoundingClientRect();
                this.cellSize = rect.width / 6;

                this.vehicles.forEach(v => {
                    let el = document.getElementById(`${this.container.id}-${v.id}`);
                    if (!el) {
                        el = document.createElement('div');
                        el.id = `${this.container.id}-${v.id}`;
                        el.className = `vehicle dir-${v.dir} ${v.color}`;
                        
                        el.addEventListener('pointerdown', (e) => this.startDrag(e, v, el));
                        this.container.appendChild(el);
                    }
                    
                    el.style.width = v.dir === 'H' ? `${this.cellSize * v.len}px` : `${this.cellSize}px`;
                    el.style.height = v.dir === 'V' ? `${this.cellSize * v.len}px` : `${this.cellSize}px`;
                    el.style.left = `${v.x * this.cellSize}px`;
                    el.style.top = `${v.y * this.cellSize}px`;
                });
            }

            startDrag(e, vehicle, el) {
                if (this.disabled) return;
                e.preventDefault();
                el.setPointerCapture(e.pointerId);

                this.draggingVehicle = vehicle;
                
                const bounds = this.calculateBounds(vehicle);

                this.dragStartObj = {
                    el: el,
                    pointerId: e.pointerId,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialLeft: vehicle.x * this.cellSize,
                    initialTop: vehicle.y * this.cellSize,
                    minPos: bounds.min * this.cellSize,
                    maxPos: bounds.max * this.cellSize
                };

                const moveHandler = (ev) => this.onDrag(ev);
                const endHandler = (ev) => {
                    this.endDrag(ev);
                    el.removeEventListener('pointermove', moveHandler);
                    el.removeEventListener('pointerup', endHandler);
                    el.removeEventListener('pointercancel', endHandler);
                };

                el.addEventListener('pointermove', moveHandler);
                el.addEventListener('pointerup', endHandler);
                el.addEventListener('pointercancel', endHandler);
            }

            onDrag(e) {
                if (!this.draggingVehicle) return;

                const dx = e.clientX - this.dragStartObj.startX;
                const dy = e.clientY - this.dragStartObj.startY;

                const v = this.draggingVehicle;
                const el = this.dragStartObj.el;

                if (v.dir === 'H') {
                    let newLeft = this.dragStartObj.initialLeft + dx;
                    newLeft = Math.max(this.dragStartObj.minPos, Math.min(this.dragStartObj.maxPos, newLeft));
                    el.style.left = `${newLeft}px`;
                } else {
                    let newTop = this.dragStartObj.initialTop + dy;
                    newTop = Math.max(this.dragStartObj.minPos, Math.min(this.dragStartObj.maxPos, newTop));
                    el.style.top = `${newTop}px`;
                }
            }

            endDrag(e) {
                if (!this.draggingVehicle) return;
                
                const v = this.draggingVehicle;
                const el = this.dragStartObj.el;
                
                if (v.dir === 'H') {
                    const currentLeft = parseFloat(el.style.left);
                    v.x = Math.round(currentLeft / this.cellSize);
                } else {
                    const currentTop = parseFloat(el.style.top);
                    v.y = Math.round(currentTop / this.cellSize);
                }

                el.style.left = `${v.x * this.cellSize}px`;
                el.style.top = `${v.y * this.cellSize}px`;
                el.releasePointerCapture(this.dragStartObj.pointerId);

                this.draggingVehicle = null;
                this.dragStartObj = null;

                if (v.isHero && v.x === 6 - v.len) {
                    el.style.left = `${6 * this.cellSize}px`;
                    setTimeout(() => {
                        this.onWin();
                    }, 300);
                }
            }

            calculateBounds(targetVehicle) {
                const grid = Array(6).fill().map(() => Array(6).fill(null));
                
                this.vehicles.forEach(v => {
                    if (v.id === targetVehicle.id) return;
                    for (let i = 0; i < v.len; i++) {
                        if (v.dir === 'H') grid[v.y][v.x + i] = v.id;
                        if (v.dir === 'V') grid[v.y + i][v.x] = v.id;
                    }
                });

                let min = 0;
                let max = 6 - targetVehicle.len;

                if (targetVehicle.dir === 'H') {
                    for (let x = targetVehicle.x - 1; x >= 0; x--) {
                        if (grid[targetVehicle.y][x] !== null) { min = x + 1; break; }
                    }
                    for (let x = targetVehicle.x + targetVehicle.len; x < 6; x++) {
                        if (grid[targetVehicle.y][x] !== null) { max = x - targetVehicle.len; break; }
                    }
                } else {
                    for (let y = targetVehicle.y - 1; y >= 0; y--) {
                        if (grid[y][targetVehicle.x] !== null) { min = y + 1; break; }
                    }
                    for (let y = targetVehicle.y + targetVehicle.len; y < 6; y++) {
                        if (grid[y][targetVehicle.x] !== null) { max = y - targetVehicle.len; break; }
                    }
                }

                return { min, max };
            }
        }

    </script>
