<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parchís Educativo Interactivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta Pastel y Colores de Jugadores */
            --bg-color: #f0f4f8;
            --text-color: #2d3748;
            --primary: #4ECDC4;
            --primary-dark: #38b2ac;
            --secondary: #FF6B6B;
            
            --board-bg: #ffffff;
            --modal-bg: rgba(0, 0, 0, 0.6);
            --font-main: 'Nunito', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            touch-action: manipulation; /* Evitar zoom al hacer doble tap en tablets */
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden; /* Prevenir scroll en MDI */
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Utilidades Generales */
        .hidden { display: none !important; }
        .flex-center { display: flex; justify-content: center; align-items: center; }
        .text-center { text-align: center; }

        /* Pantallas */
        .screen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #ffffff 0%, var(--bg-color) 100%);
            z-index: 10;
        }

        /* Botones estilo MDI (Grandes, clickeables) */
        .btn {
            background-color: var(--primary);
            color: white;
            font-family: var(--font-main);
            font-size: 1.5rem;
            font-weight: 900;
            padding: 15px 30px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0 var(--primary-dark), 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 200px;
            min-height: 70px;
        }

        .btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 var(--primary-dark), 0 5px 10px rgba(0,0,0,0.2);
        }

        .btn-secondary { background-color: var(--secondary); box-shadow: 0 8px 0 #c83b3b; }
        .btn-secondary:active { box-shadow: 0 0 0 #c83b3b; }

        /* Pantalla de Configuración */
        #screen-config {
            padding: 20px;
            overflow-y: auto;
            align-items: center;
        }

        .config-card {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 800px;
            margin: auto;
        }

        .config-card h1 {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            font-size: 1.4rem;
            font-weight: 700;
            display: block;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .form-control {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 3px solid #e2e8f0;
            border-radius: 15px;
            font-family: var(--font-main);
            transition: border-color 0.3s;
        }

        .form-control:focus { outline: none; border-color: var(--primary); }

        /* Pantalla de Juego */
        #screen-game { z-index: 20; background: #e8f4f8; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            height: 100px;
        }

        .turn-indicator {
            font-size: 2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-color);
            padding: 10px 25px;
            border-radius: 20px;
            border: 4px solid transparent;
            transition: all 0.3s;
        }
        
        .turn-color-dot { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(0,0,0,0.2); }

        .dice-container {
            position: relative;
            cursor: pointer;
        }

        .dice {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            box-shadow: inset 0 -5px 0 #e2e8f0, 0 10px 20px rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 10px;
            gap: 5px;
            transition: transform 0.1s;
            border: 2px solid #cbd5e0;
        }

        .dice:active { transform: scale(0.95); }
        .dice.rolling { animation: shake 0.4s infinite; pointer-events: none; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-10deg); }
            20% { transform: translate(-3px, 0px) rotate(10deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(10deg); }
            50% { transform: translate(-1px, 2px) rotate(-10deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-10deg); }
            80% { transform: translate(-1px, -1px) rotate(10deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-10deg); }
        }

        .dot { background-color: #2d3748; border-radius: 50%; width: 100%; height: 100%; display: none; }
        
        /* Reglas de Puntos del Dado */
        .dice[data-value="1"] .dot:nth-child(5) { display: block; }
        .dice[data-value="2"] .dot:nth-child(3), .dice[data-value="2"] .dot:nth-child(7) { display: block; }
        .dice[data-value="3"] .dot:nth-child(3), .dice[data-value="3"] .dot:nth-child(5), .dice[data-value="3"] .dot:nth-child(7) { display: block; }
        .dice[data-value="4"] .dot:nth-child(1), .dice[data-value="4"] .dot:nth-child(3), .dice[data-value="4"] .dot:nth-child(7), .dice[data-value="4"] .dot:nth-child(9) { display: block; }
        .dice[data-value="5"] .dot:nth-child(1), .dice[data-value="5"] .dot:nth-child(3), .dice[data-value="5"] .dot:nth-child(5), .dice[data-value="5"] .dot:nth-child(7), .dice[data-value="5"] .dot:nth-child(9) { display: block; }
        .dice[data-value="6"] .dot:nth-child(1), .dice[data-value="6"] .dot:nth-child(3), .dice[data-value="6"] .dot:nth-child(4), .dice[data-value="6"] .dot:nth-child(6), .dice[data-value="6"] .dot:nth-child(7), .dice[data-value="6"] .dot:nth-child(9) { display: block; }

        /* Contenedor del Tablero SVG */
        .board-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 100px); /* Ajuste estricto para monitores MDI */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2vmin;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
        }

        #game-board {
            width: 100%;
            height: 100%;
            max-width: 95vmin;
            max-height: 95vmin;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.1));
            touch-action: none; /* Crucial para MDI y arrastre/click */
        }

        .piece {
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .piece:hover circle[r="22"] { stroke-width: 5px; stroke: white; }
        .piece.selectable circle[r="22"] { animation: pulsePiece 1s infinite alternate; }
        
        @keyframes pulsePiece {
            0% { filter: brightness(1) drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
            100% { filter: brightness(1.3) drop-shadow(0 0 15px rgba(255,255,255,1)); }
        }

        /* Modales */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-bg);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 40px;
            width: 90%;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .question-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary-dark);
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .option-btn {
            font-size: 1.8rem;
            padding: 20px;
            border-radius: 20px;
            background: #f7fafc;
            border: 4px solid #edf2f7;
            color: var(--text-color);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-main);
        }
        .option-btn:active { transform: scale(0.95); }
        .option-btn.correct { background: #c6f6d5; border-color: #48bb78; color: #22543d; }
        .option-btn.incorrect { background: #fed7d7; border-color: #e53e3e; color: #742a2a; }

        .timer-bar {
            width: 100%;
            height: 20px;
            background: #edf2f7;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }
        .timer-fill {
            height: 100%;
            background: var(--secondary);
            width: 100%;
            transition: width 1s linear;
        }

        .message-modal h2 { font-size: 4rem; margin-bottom: 20px; }
        .message-modal p { font-size: 2rem; margin-bottom: 30px; }
        .feedback-icon { font-size: 6rem; margin-bottom: 20px; display: block; }
        
        /* Instrucciones en pantalla de juego */
        #game-instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Configuración -->
    <div id="screen-config" class="screen">
        <div class="config-card text-center">
            <h1>🎲 Parchís Educativo</h1>
            <p style="font-size:1.2rem; margin-bottom: 20px; color:#718096;">Configura la partida para jugar en la pizarra interactiva o tablet.</p>
            
            <div class="form-group">
                <label for="num-players">Número de Equipos (2 - 6):</label>
                <select id="num-players" class="form-control">
                    <option value="2">2 Equipos</option>
                    <option value="3">3 Equipos</option>
                    <option value="4" selected>4 Equipos</option>
                    <option value="5">5 Equipos</option>
                    <option value="6">6 Equipos</option>
                </select>
            </div>

            <div class="form-group">
                <label for="time-limit">Tiempo para responder (segundos):</label>
                <input type="number" id="time-limit" class="form-control" value="20" min="5" max="120">
            </div>

            <div class="form-group" id="json-group">
                <label>Base de Preguntas (Repaso Lengua 2º Primaria - 50 Preguntas):</label>
                <div style="display: flex; gap: 15px; justify-content: center; margin-top: 15px; flex-wrap: wrap;">
                    <button class="btn btn-secondary" onclick="downloadJSON()" style="font-size: 1rem; min-width: auto; padding: 10px 20px;">⬇️ Descargar Ejemplo</button>
                    <button class="btn" onclick="document.getElementById('file-upload').click()" style="font-size: 1rem; min-width: auto; padding: 10px 20px; background-color: #9D4EDD; box-shadow: 0 8px 0 #7b2cbf;">⬆️ Cargar Archivo JSON</button>
                    <input type="file" id="file-upload" accept=".json" style="display: none;" onchange="handleFileUpload(event)">
                </div>
                <p id="upload-status" style="font-size: 1.1rem; color: #48bb78; margin-top: 15px; font-weight: 800; display: none;">¡Archivo cargado con éxito!</p>
            </div>

            <button class="btn" onclick="startGame()">¡Comenzar a Jugar! 🚀</button>
        </div>
    </div>

    <!-- Pantalla de Juego Principal -->
    <div id="screen-game" class="screen hidden">
        <header class="game-header">
            <div class="turn-indicator" id="turn-indicator">
                <div class="turn-color-dot" id="turn-dot"></div>
                Turno: <span id="turn-name">1</span>
            </div>
            
            <button class="btn btn-secondary" onclick="endGame()" style="min-width: 120px; min-height: 50px; font-size: 1.2rem; padding: 10px 20px; box-shadow: 0 5px 0 #c83b3b;">Salir 🚪</button>
        </header>

        <main class="board-container" id="board-container">
            <!-- El SVG se inyectará aquí de forma dinámica -->
        </main>
        
        <div id="game-instructions">Tira el dado para comenzar tu turno.</div>
    </div>

    <!-- Modal de Turno y Dado en Primer Plano -->
    <div id="modal-turn" class="modal-overlay">
        <div class="modal-content" style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <h2 id="turn-modal-title" style="font-size: 3rem; margin-bottom: 5px; font-weight: 900;">¡Turno del Equipo!</h2>
            <p id="turn-modal-subtitle" style="font-size: 1.6rem; color: #718096; margin-bottom: 15px;">Toca el dado para lanzar</p>
            
            <div class="dice-container" onclick="rollDiceClick()" style="transform: scale(1.5); margin: 20px 0;">
                <div class="dice" id="main-dice" data-value="6">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Pregunta -->
    <div id="modal-question" class="modal-overlay">
        <div class="modal-content">
            <div class="question-text" id="q-text">¿Pregunta?</div>
            <div class="options-grid" id="q-options">
                <!-- Botones inyectados vía JS -->
            </div>
            <div class="timer-bar"><div class="timer-fill" id="q-timer"></div></div>
        </div>
    </div>

    <!-- Modal de Mensajes Generales (Aciertos, Errores, Victoria) -->
    <div id="modal-message" class="modal-overlay">
        <div class="modal-content message-modal">
            <span class="feedback-icon" id="msg-icon">🎉</span>
            <h2 id="msg-title">¡Correcto!</h2>
            <p id="msg-desc">Te quedas en la casilla.</p>
            <button class="btn" id="msg-btn" onclick="closeMessageModal()">Continuar</button>
        </div>
    </div>

    <script>
        /* --- AUDIO ENGINE (Web Audio API) --- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type = 'sine', duration = 0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function soundClick() { playTone(600, 'sine', 0.1); }
        function soundRoll() {
            let time = 0;
            for(let i=0; i<5; i++) {
                setTimeout(() => playTone(300 + Math.random()*200, 'square', 0.05), time);
                time += 80;
            }
        }
        function soundSuccess() {
            playTone(440, 'sine', 0.1); // A4
            setTimeout(() => playTone(554.37, 'sine', 0.1), 100); // C#5
            setTimeout(() => playTone(659.25, 'sine', 0.3), 200); // E5
        }
        function soundFail() {
            playTone(300, 'sawtooth', 0.2);
            setTimeout(() => playTone(250, 'sawtooth', 0.4), 200);
        }
        function soundWin() {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'square', 0.2), i * 150);
            });
            setTimeout(() => playTone(1046.50, 'square', 0.6), 600);
        }

        /* --- ESTADO DEL JUEGO Y VARIABLES --- */
        const GAME_STATES = { CONFIG: 0, WAITING_ROLL: 1, SELECTING_PIECE: 2, MOVING: 3, ANSWERING: 4 };
        let currentState = GAME_STATES.CONFIG;
        
        const COLORS = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#9D4EDD', '#FF9F1C', '#80ED99'];
        const COLOR_NAMES = ['Rojo', 'Turquesa', 'Amarillo', 'Morado', 'Naranja', 'Verde'];
        
        let config = { numPlayers: 4, timeLimit: 20, questions: [] };
        let players = [];
        let currentTurn = 0;
        let lastRoll = 0;
        let activePieceRef = null;
        let currentTimer = null;
        let gameQuestions = [];
        
        const defaultQuestions = [
            // Sinónimos (1-8)
            { "q": "¿Cuál es el sinónimo de FELIZ?", "options": ["Triste", "Contento", "Enfadado", "Llorón"], "correct": 1 },
            { "q": "Elige el sinónimo de GRANDE:", "options": ["Enorme", "Pequeño", "Bajo", "Delgado"], "correct": 0 },
            { "q": "¿Qué palabra significa lo mismo que RÁPIDO?", "options": ["Lento", "Despacio", "Veloz", "Tranquilo"], "correct": 2 },
            { "q": "Sinónimo de SALTAR:", "options": ["Brincar", "Correr", "Andar", "Dormir"], "correct": 0 },
            { "q": "Un sinónimo de GUAPO es...", "options": ["Feo", "Bello", "Sucio", "Malo"], "correct": 1 },
            { "q": "Elige el sinónimo de ANDAR:", "options": ["Correr", "Volar", "Caminar", "Nadar"], "correct": 2 },
            { "q": "¿Cuál es el sinónimo de PROFESOR?", "options": ["Alumno", "Maestro", "Médico", "Niño"], "correct": 1 },
            { "q": "Sinónimo de ESCUCHAR:", "options": ["Hablar", "Cantar", "Oír", "Mirar"], "correct": 2 },
            
            // Antónimos (9-16)
            { "q": "¿Cuál es el antónimo (contrario) de ALTO?", "options": ["Largo", "Fuerte", "Bajo", "Grande"], "correct": 2 },
            { "q": "El antónimo de BLANCO es:", "options": ["Limpio", "Negro", "Amarillo", "Claro"], "correct": 1 },
            { "q": "¿Cuál es el contrario de DÍA?", "options": ["Sol", "Mañana", "Tarde", "Noche"], "correct": 3 },
            { "q": "Elige el antónimo de ENTRAR:", "options": ["Salir", "Llegar", "Pasar", "Subir"], "correct": 0 },
            { "q": "Lo contrario de FRÍO es...", "options": ["Hielo", "Nieve", "Calor", "Lluvia"], "correct": 2 },
            { "q": "Antónimo de ABRIR:", "options": ["Romper", "Cerrar", "Tirar", "Soltar"], "correct": 1 },
            { "q": "¿Cuál es el contrario de LLORAR?", "options": ["Reír", "Gritar", "Hablar", "Tristeza"], "correct": 0 },
            { "q": "El antónimo de FÁCIL es:", "options": ["Sencillo", "Corto", "Difícil", "Rápido"], "correct": 2 },

            // Ortografía (17-26)
            { "q": "Elige la palabra bien escrita:", "options": ["Campana", "Canpana", "Camppana", "Canbana"], "correct": 0 },
            { "q": "¿Cómo se escribe correctamente?", "options": ["Zanahoria", "Sanahoria", "Chanahoria", "Zanaoria"], "correct": 0 },
            { "q": "Completa la palabra: __eso", "options": ["C", "K", "Qu", "Z"], "correct": 2 },
            { "q": "Elige la palabra bien escrita:", "options": ["Zerezas", "Cerezas", "Serezas", "Kerezas"], "correct": 1 },
            { "q": "Completa: El __ato bebe leche.", "options": ["g", "j", "gu", "h"], "correct": 0 },
            { "q": "¿Qué palabra lleva RR?", "options": ["Pe__o (animal)", "Pe__o (fruta)", "Ca__a (rostro)", "Teso__o"], "correct": 0 },
            { "q": "Elige la palabra correcta:", "options": ["Bombilla", "Vonvilla", "Bonbilla", "Vombilla"], "correct": 0 },
            { "q": "Antes de P y B siempre se escribe...", "options": ["N", "M", "L", "S"], "correct": 1 },
            { "q": "¿Cómo se escribe?", "options": ["Jirafa", "Girafa", "Hirafa", "Yirafa"], "correct": 0 },
            { "q": "Completa: La man__uera tira agua.", "options": ["g", "gu", "j", "h"], "correct": 1 },

            // Separación silábica (27-32)
            { "q": "¿Cuántas sílabas tiene la palabra CAMISA?", "options": ["1", "2", "3", "4"], "correct": 2 },
            { "q": "Separa en sílabas: SOL", "options": ["So-l", "Sol", "S-ol", "S-o-l"], "correct": 1 },
            { "q": "¿Cuántas sílabas tiene ORDENADOR?", "options": ["3", "4", "5", "6"], "correct": 1 },
            { "q": "Separa en sílabas: PELOTA", "options": ["Pe-lo-ta", "Pel-o-ta", "Pe-lot-a", "Pelo-ta"], "correct": 0 },
            { "q": "¿Qué palabra tiene 2 sílabas?", "options": ["Pan", "Lápiz", "Elefante", "Mariposa"], "correct": 1 },
            { "q": "¿Cuántas sílabas tiene MARIPOSA?", "options": ["2", "3", "4", "5"], "correct": 2 },

            // Gramática: Sustantivos, Adjetivos, Verbos (33-42)
            { "q": "¿Cuál de estas palabras es un VERBO (acción)?", "options": ["Mesa", "Correr", "Rojo", "Lápiz"], "correct": 1 },
            { "q": "Identifica el VERBO:", "options": ["Libro", "Gato", "Saltar", "Feliz"], "correct": 2 },
            { "q": "¿Qué palabra es un ADJETIVO (cómo es)?", "options": ["Coche", "Casa", "Grande", "Jugar"], "correct": 2 },
            { "q": "Elige el ADJETIVO:", "options": ["Bonito", "Perro", "Beber", "Parque"], "correct": 0 },
            { "q": "¿Cuál es un Sustantivo Propio (nombre)?", "options": ["ciudad", "río", "niño", "Madrid"], "correct": 3 },
            { "q": "Los nombres de personas o ciudades se escriben con...", "options": ["Minúscula", "Mayúscula", "Comillas", "Tilde"], "correct": 1 },
            { "q": "¿Qué palabra es un sustantivo común?", "options": ["Laura", "Ebro", "Perro", "España"], "correct": 2 },
            { "q": "Elige el artículo para completar: __ mesa.", "options": ["El", "Los", "Las", "La"], "correct": 3 },
            { "q": "Completa: __ perros ladran.", "options": ["El", "Los", "La", "Las"], "correct": 1 },
            { "q": "¿Cuál de estas palabras indica que la acción ya pasó (Pasado)?", "options": ["Comeré", "Como", "Comí", "Comiendo"], "correct": 2 },

            // Puntuación, Diminutivos y Aumentativos (43-50)
            { "q": "¿Qué signos se usan para hacer una pregunta?", "options": ["¡ !", "¿ ?", "( )", "- -"], "correct": 1 },
            { "q": "¿Qué signos indican sorpresa o exclamación?", "options": ["¡ !", "¿ ?", "\" \"", ", ."], "correct": 0 },
            { "q": "El diminutivo de PERRO es...", "options": ["Perrazo", "Perrito", "Perrera", "Perros"], "correct": 1 },
            { "q": "El aumentativo de CASA es...", "options": ["Casita", "Casucha", "Casona", "Casilla"], "correct": 2 },
            { "q": "¿Qué falta al final de una frase?", "options": ["Una coma", "Un punto", "Una letra", "Nada"], "correct": 1 },
            { "q": "El diminutivo de PÁJARO es:", "options": ["Pajarito", "Pajarote", "Pajarraco", "Pájaros"], "correct": 0 },
            { "q": "El aumentativo de GOL es:", "options": ["Golito", "Golazo", "Goles", "Goleada"], "correct": 1 },
            { "q": "¿Cuál es la frase correcta?", "options": ["¡Hola?", "¿Cómo estás?", "¡Qué bien?", "¿Cuántos años tienes!"], "correct": 1 }
        ];

        /* --- MANEJO DE ARCHIVOS JSON --- */
        function downloadJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(defaultQuestions, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "preguntas_lengua_2primaria.json");
            dlAnchorElem.click();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].q && parsed[0].options) {
                        gameQuestions = parsed;
                        const status = document.getElementById('upload-status');
                        status.style.display = 'block';
                        status.textContent = `¡Archivo cargado! (${parsed.length} preguntas listas)`;
                        setTimeout(() => status.style.display = 'none', 5000);
                    } else {
                        alert("Formato JSON incorrecto. Asegúrate de usar la plantilla descargada.");
                    }
                } catch (err) {
                    alert("Error al leer el archivo JSON.");
                }
            };
            reader.readAsText(file);
        }

        // Función para barajar (Shuffle) con criptografía pura (Fisher-Yates seguro)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const randomBuffer = new Uint32Array(1);
                window.crypto.getRandomValues(randomBuffer);
                const j = randomBuffer[0] % (i + 1);
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Coordenadas generadas para el tablero SVG (ViewBox 0 0 1000 1000)
        const BOARD_SPACES = 36;
        let spaceCoords = [];
        let homeCoords = [];
        let nestCoords = [];

        function startGame() {
            soundClick();
            
            // Recoger configuración
            config.numPlayers = parseInt(document.getElementById('num-players').value);
            config.timeLimit = parseInt(document.getElementById('time-limit').value);
            
            if (gameQuestions.length === 0) gameQuestions = [...defaultQuestions];
            config.questions = gameQuestions;

            // Inicializar Jugadores
            players = [];
            
            // Distribuir equitativamente en 36 casillas
            const startOffsets = {
                2: [0, 18],
                3: [0, 12, 24],
                4: [0, 9, 18, 27],
                5: [0, 7, 14, 21, 28],
                6: [0, 6, 12, 18, 24, 30]
            };
            let starts = startOffsets[config.numPlayers];

            for(let i = 0; i < config.numPlayers; i++) {
                players.push({
                    originalId: i, // Guardamos su ID de color original
                    color: COLORS[i],
                    name: COLOR_NAMES[i],
                    startSpace: starts[i],
                    pieces: [
                        { id: 0, state: 'nest', pos: -1, isHomeStretch: false },
                        { id: 1, state: 'nest', pos: -1, isHomeStretch: false },
                        { id: 2, state: 'nest', pos: -1, isHomeStretch: false },
                        { id: 3, state: 'nest', pos: -1, isHomeStretch: false }
                    ]
                });
            }

            // Aleatorizar el orden de turnos (para que no empiece siempre el Rojo)
            shuffleArray(players);

            document.getElementById('screen-config').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            
            generateBoardSVG();
            currentTurn = 0;
            showTurnModal(); // Mostrar ventana del primer equipo
        }

        function endGame() {
            soundClick();
            if(confirm("¿Estás seguro de que deseas salir del juego y volver al menú principal?")) {
                document.getElementById('screen-game').classList.add('hidden');
                document.getElementById('screen-config').classList.remove('hidden');
                document.getElementById('pieces-layer').innerHTML = ''; // Limpiar tablero
            }
        }

        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        }

        function generateBoardSVG() {
            const container = document.getElementById('board-container');
            let svg = `<svg id="game-board" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;
            
            svg += `<circle cx="500" cy="500" r="480" fill="#ffffff" stroke="#e2e8f0" stroke-width="10"/>`;
            svg += `<circle cx="500" cy="500" r="140" fill="url(#center-grad)" stroke="#cbd5e0" stroke-width="5"/>`;
            svg += `<defs>
                <radialGradient id="center-grad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#f7fafc"/>
                    <stop offset="100%" stop-color="#e2e8f0"/>
                </radialGradient>
                <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.3"/></filter>
            </defs>`;
            svg += `<text x="500" y="515" text-anchor="middle" font-size="45" font-weight="900" fill="#718096">META</text>`;

            spaceCoords = [];
            homeCoords = [];
            nestCoords = [];
            const CENTER = {x: 500, y: 500};
            const TRACK_RADIUS = 310; // Reducido para casillas más grandes

            // 1. Calcular Nidos
            for(let p=0; p<players.length; p++) {
                const angle = (players[p].startSpace / BOARD_SPACES) * 360;
                const nestCenter = polarToCartesian(CENTER.x, CENTER.y, 425, angle);
                
                svg += `<circle cx="${nestCenter.x}" cy="${nestCenter.y}" r="75" fill="${players[p].color}" fill-opacity="0.2" stroke="${players[p].color}" stroke-width="5"/>`;
                
                let pNests = [];
                const offsets = [{dx:-28, dy:-28}, {dx:28, dy:-28}, {dx:-28, dy:28}, {dx:28, dy:28}];
                for(let i=0; i<4; i++) {
                    let nx = nestCenter.x + offsets[i].dx;
                    let ny = nestCenter.y + offsets[i].dy;
                    pNests.push({x: nx, y: ny});
                    svg += `<circle cx="${nx}" cy="${ny}" r="18" fill="#ffffff" fill-opacity="0.6"/>`;
                }
                nestCoords.push(pNests);
            }

            // 2. Calcular TRACK (36 espacios)
            for(let i=0; i<BOARD_SPACES; i++) {
                const angle = (i / BOARD_SPACES) * 360;
                const coord = polarToCartesian(CENTER.x, CENTER.y, TRACK_RADIUS, angle);
                spaceCoords.push({x: coord.x, y: coord.y, angle: angle});
                
                let isStart = players.find(pl => pl.startSpace === i);
                let fillColor = isStart ? isStart.color : "#ffffff";
                let strokeColor = isStart ? "#ffffff" : "#cbd5e0";
                let strokeW = isStart ? "4" : "3";
                
                svg += `<circle cx="${coord.x}" cy="${coord.y}" r="28" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${strokeW}"/>`;
                let txtColor = isStart ? "#ffffff" : "#718096";
                svg += `<text x="${coord.x}" y="${coord.y+8}" text-anchor="middle" font-size="22" font-weight="bold" fill="${txtColor}">${i}</text>`;
            }

            // 3. Pasillos de meta
            for(let p=0; p<players.length; p++) {
                homeCoords[p] = [];
                let endSpaceIndex = (players[p].startSpace - 1 + BOARD_SPACES) % BOARD_SPACES;
                let endSpace = spaceCoords[endSpaceIndex];
                
                let dx = CENTER.x - endSpace.x;
                let dy = CENTER.y - endSpace.y;
                
                for(let h=1; h<=4; h++) {
                    let hx = endSpace.x + (dx * (h / 5.5)); 
                    let hy = endSpace.y + (dy * (h / 5.5));
                    homeCoords[p].push({x: hx, y: hy});
                    
                    svg += `<circle cx="${hx}" cy="${hy}" r="24" fill="${players[p].color}" fill-opacity="0.6" stroke="${players[p].color}" stroke-width="3"/>`;
                }
            }

            svg += `<g id="pieces-layer"></g>`;
            svg += `</svg>`;
            
            container.innerHTML = svg;
            renderAllPieces();
        }

        function renderAllPieces() {
            const layer = document.getElementById('pieces-layer');
            let piecesSVG = '';
            
            players.forEach((player, pIndex) => {
                player.pieces.forEach((piece, pieceIndex) => {
                    let coords = getPieceCoords(pIndex, piece);
                    piecesSVG += `
                    <g id="piece-${pIndex}-${pieceIndex}" class="piece" transform="translate(${coords.x}, ${coords.y})" onclick="handlePieceClick(${pIndex}, ${pieceIndex})">
                        <circle cx="0" cy="0" r="22" fill="${player.color}" stroke="white" stroke-width="4" filter="url(#shadow)"/>
                        <circle cx="0" cy="-5" r="14" fill="rgba(255,255,255,0.3)"/>
                    </g>`;
                });
            });
            layer.innerHTML = piecesSVG;
        }

        function getPieceCoords(pIndex, piece) {
            if (piece.state === 'nest') return nestCoords[pIndex][piece.id];
            if (piece.state === 'finished') return {x: 500, y: 500};
            if (piece.isHomeStretch) return homeCoords[pIndex][piece.pos];
            return spaceCoords[piece.pos];
        }

        function updatePieceDOM(pIndex, pieceIndex) {
            const piece = players[pIndex].pieces[pieceIndex];
            const el = document.getElementById(`piece-${pIndex}-${pieceIndex}`);
            if(!el) return;
            let coords = getPieceCoords(pIndex, piece);
            el.setAttribute('transform', `translate(${coords.x}, ${coords.y})`);
        }

        function setGameState(state) {
            currentState = state;
            const inst = document.getElementById('game-instructions');
            const pieces = document.querySelectorAll('.piece');
            
            pieces.forEach(p => p.classList.remove('selectable'));

            switch(state) {
                case GAME_STATES.WAITING_ROLL:
                    inst.textContent = `Esperando a que el Equipo ${players[currentTurn].name} tire el dado.`;
                    break;
                case GAME_STATES.SELECTING_PIECE:
                    inst.textContent = `Toca una ficha iluminada para mover ${lastRoll} espacio(s).`;
                    // Resaltar fichas válidas (BUG SOLUCIONADO)
                    players[currentTurn].pieces.forEach((pc, i) => {
                        if (pc.state !== 'finished') {
                            document.getElementById(`piece-${currentTurn}-${i}`).classList.add('selectable');
                        }
                    });
                    break;
                case GAME_STATES.MOVING:
                case GAME_STATES.ANSWERING:
                    inst.textContent = "";
                    break;
            }
        }

        function showTurnModal(isExtraTurn = false) {
            updateTurnUI();
            const modal = document.getElementById('modal-turn');
            const title = document.getElementById('turn-modal-title');
            const subtitle = document.getElementById('turn-modal-subtitle');
            const diceEl = document.getElementById('main-dice');
            
            title.textContent = (isExtraTurn ? "¡Tirada Extra! " : "¡Turno del ") + "Equipo " + players[currentTurn].name;
            title.style.color = players[currentTurn].color;
            subtitle.innerHTML = "Toca el dado central para lanzar 🎯";
            
            diceEl.setAttribute('data-value', '6');
            diceEl.style.pointerEvents = 'auto';
            
            modal.classList.add('active');
            setGameState(GAME_STATES.WAITING_ROLL);
        }

        function rollDiceClick() {
            if (currentState !== GAME_STATES.WAITING_ROLL) return;
            soundRoll();
            
            const diceEl = document.getElementById('main-dice');
            diceEl.classList.add('rolling');
            diceEl.style.pointerEvents = 'none';
            
            setTimeout(() => {
                diceEl.classList.remove('rolling');
                
                // Generador criptográfico (100% puro y aleatorio)
                const randBuffer = new Uint32Array(1);
                window.crypto.getRandomValues(randBuffer);
                lastRoll = (randBuffer[0] % 6) + 1;
                
                diceEl.setAttribute('data-value', lastRoll);
                document.getElementById('turn-modal-subtitle').innerHTML = `¡Has sacado un <strong>${lastRoll}</strong>! 🚀`;
                
                setTimeout(() => {
                    document.getElementById('modal-turn').classList.remove('active');
                    
                    let canMove = players[currentTurn].pieces.some(pc => pc.state !== 'finished');
                    if(!canMove) {
                        showFeedback("Sin Movimientos", "Todas tus fichas están en la meta.", "⏭️", () => nextTurn());
                    } else {
                        setGameState(GAME_STATES.SELECTING_PIECE);
                    }
                }, 1800);

            }, 600);
        }

        function handlePieceClick(pIndex, pieceIndex) {
            if (currentState !== GAME_STATES.SELECTING_PIECE) return;
            if (pIndex !== currentTurn) { playTone(200, 'square', 0.1); return; }
            
            const player = players[pIndex];
            const piece = player.pieces[pieceIndex];
            if (piece.state === 'finished') return;

            soundClick();
            setGameState(GAME_STATES.MOVING);

            activePieceRef = {
                pIndex, pieceIndex, 
                origState: piece.state, 
                origPos: piece.pos,
                origHomeStretch: piece.isHomeStretch
            };

            // Calcular destino en un tablero de 36 espacios
            if (piece.state === 'nest') {
                piece.state = 'board';
                piece.pos = player.startSpace;
            } else if (piece.isHomeStretch) {
                piece.pos += lastRoll;
                if (piece.pos >= 4) { piece.state = 'finished'; }
            } else {
                let targetPos = piece.pos;
                let movesLeft = lastRoll;
                let endSpaceIndex = (player.startSpace - 1 + BOARD_SPACES) % BOARD_SPACES;
                
                while(movesLeft > 0) {
                    if (!piece.isHomeStretch && targetPos === endSpaceIndex) {
                        piece.isHomeStretch = true;
                        piece.pos = -1;
                        targetPos = -1;
                    }
                    
                    if (piece.isHomeStretch) {
                        targetPos++;
                        if (targetPos >= 4) { piece.state = 'finished'; break; }
                    } else {
                        targetPos = (targetPos + 1) % BOARD_SPACES;
                    }
                    movesLeft--;
                }
                if (piece.state !== 'finished') piece.pos = targetPos;
            }

            updatePieceDOM(pIndex, pieceIndex);

            setTimeout(() => { askQuestion(); }, 500);
        }

        function askQuestion() {
            setGameState(GAME_STATES.ANSWERING);
            
            // Elegir pregunta aleatoria con Crypto
            const randBuffer = new Uint32Array(1);
            window.crypto.getRandomValues(randBuffer);
            const qIndex = randBuffer[0] % config.questions.length;
            const q = config.questions[qIndex];
            
            document.getElementById('q-text').textContent = q.q;
            const optsContainer = document.getElementById('q-options');
            optsContainer.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => submitAnswer(idx, q.correct, btn);
                optsContainer.appendChild(btn);
            });

            document.getElementById('modal-question').classList.add('active');
            
            const timerFill = document.getElementById('q-timer');
            timerFill.style.transition = 'none';
            timerFill.style.width = '100%';
            
            setTimeout(() => {
                timerFill.style.transition = `width ${config.timeLimit}s linear`;
                timerFill.style.width = '0%';
            }, 50);

            clearTimeout(currentTimer);
            currentTimer = setTimeout(() => {
                if(currentState === GAME_STATES.ANSWERING) {
                    submitAnswer(-1, q.correct, null); // Timeout
                }
            }, config.timeLimit * 1000);
        }

        function submitAnswer(selectedIndex, correctIndex, btnElement) {
            if (currentState !== GAME_STATES.ANSWERING) return;
            clearTimeout(currentTimer);
            
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.onclick = null); // disable clicks

            if (selectedIndex === correctIndex) {
                if(btnElement) btnElement.classList.add('correct');
                soundSuccess();
                setTimeout(() => {
                    document.getElementById('modal-question').classList.remove('active');
                    handleTurnResult(true);
                }, 1000);
            } else {
                if(btnElement) btnElement.classList.add('incorrect');
                if(btns[correctIndex]) btns[correctIndex].classList.add('correct');
                soundFail();
                setTimeout(() => {
                    document.getElementById('modal-question').classList.remove('active');
                    handleTurnResult(false);
                }, 2000);
            }
        }

        function handleTurnResult(isCorrect) {
            const piece = players[activePieceRef.pIndex].pieces[activePieceRef.pieceIndex];
            
            if (!isCorrect) {
                piece.state = activePieceRef.origState;
                piece.pos = activePieceRef.origPos;
                piece.isHomeStretch = activePieceRef.origHomeStretch;
                updatePieceDOM(activePieceRef.pIndex, activePieceRef.pieceIndex);
                
                showFeedback("¡Oh no!", "Respuesta incorrecta. Vuelves a tu sitio.", "🔙", () => nextTurn());
            } else {
                let allFinished = players[currentTurn].pieces.every(pc => pc.state === 'finished');
                if (allFinished) {
                    soundWin();
                    showFeedback(`¡EQUIPO ${players[currentTurn].name.toUpperCase()} GANA!`, "¡Han llevado todas las fichas a la meta!", "🏆", () => location.reload(), "Volver a Jugar");
                    return;
                }

                if (lastRoll === 6) {
                    showFeedback("¡Tirada Extra!", "Acertaste y sacaste un 6. ¡Vuelves a tirar!", "🎲", () => {
                        showTurnModal(true);
                    });
                } else {
                    nextTurn();
                }
            }
        }

        function nextTurn() {
            currentTurn = (currentTurn + 1) % config.numPlayers;
            showTurnModal();
        }

        function updateTurnUI() {
            const indicator = document.getElementById('turn-indicator');
            const name = document.getElementById('turn-name');
            const dot = document.getElementById('turn-dot');
            
            indicator.style.borderColor = players[currentTurn].color;
            name.textContent = players[currentTurn].name;
            name.style.color = players[currentTurn].color;
            dot.style.backgroundColor = players[currentTurn].color;
        }

        /* --- UI MODALS HELPERS --- */
        let modalCallback = null;
        function showFeedback(title, desc, icon, callback, btnText = "Continuar") {
            document.getElementById('msg-title').textContent = title;
            document.getElementById('msg-desc').textContent = desc;
            document.getElementById('msg-icon').textContent = icon;
            document.getElementById('msg-btn').textContent = btnText;
            document.getElementById('modal-message').classList.add('active');
            modalCallback = callback;
        }

        function closeMessageModal() {
            document.getElementById('modal-message').classList.remove('active');
            soundClick();
            if (modalCallback) {
                let cb = modalCallback;
                modalCallback = null;
                cb();
            }
        }
        
        // Evitar menús contextuales por pulsación larga táctil
        document.addEventListener('contextmenu', event => event.preventDefault());

    </script>
